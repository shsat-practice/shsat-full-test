<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHSAT Practice — ELA &amp; Mathematics</title>
<style>
:root{
  --ink:#16202e; --ink-soft:#5a6579; --ink-faint:#8b94a5;
  --rule:#dde3ec; --canvas:#eef1f6; --card:#fff;
  --accent:#1f5aa8; --accent-soft:#e9f0fa; --accent-deep:#16416f;
  --amber:#8a6114; --amber-bg:#fdf3dd; --amber-line:#e7cf9a;
  --danger:#b42318; --ok:#15803d;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--ui);
     font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
.wrap.wide{max-width:1400px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff}
.bar-in{max-width:1400px;margin:0 auto;padding:12px 24px;display:flex;
        align-items:center;justify-content:space-between;gap:14px}
.brand{font-size:14px;font-weight:600;letter-spacing:.02em}
.brand span{color:#93a3bb;font-weight:500}
.count{font-size:14px;color:#c2ccdb;font-variant-numeric:tabular-nums}
.track{height:3px;background:#0d1725}
.track i{display:block;height:100%;background:#5b9bd8;transition:width .25s ease}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;
      padding:32px 40px;margin:26px 0}
h1{font-size:28px;line-height:1.25;margin:0 0 14px}
h2{font-size:16px;font-weight:700;margin:24px 0 10px}
.lede{color:var(--ink-soft);margin:0 0 20px}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.qnum{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
      color:var(--ink-faint)}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
       color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-line);
       padding:2px 8px;border-radius:4px}

/* ---------- split layout ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
       align-items:start;margin:22px 0}
.pane{background:var(--card);border:1px solid var(--rule);border-radius:10px;
      display:flex;flex-direction:column;min-height:0}
.pane.passage{position:sticky;top:64px;max-height:calc(100vh - 92px)}
.pane.qs{padding:28px 32px}
.ptabs{display:flex;gap:3px;padding:7px 8px 0;border-bottom:1px solid var(--rule);
       flex-wrap:wrap;flex:none;background:#f7f9fc;border-radius:10px 10px 0 0}
.ptab{flex:none;border:1px solid transparent;border-bottom:none;background:none;
      padding:7px 10px;border-radius:7px 7px 0 0;font-size:12px;font-weight:600;
      color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.ptab:hover{background:#eef2f8;color:var(--ink)}
.ptab.on{background:#fff;border-color:var(--rule);color:var(--ink);
         box-shadow:0 1px 0 #fff;margin-bottom:-1px}
.ptab.done{color:var(--ink-faint);cursor:not-allowed;opacity:.65}
.ptab.done:hover{background:none;color:var(--ink-faint)}
.ptab .lk{font-size:11px;margin-right:4px}
.pbody{overflow-y:auto;padding:22px 30px 28px;font-family:var(--serif);
       font-size:16.5px;line-height:1.62;flex:1;min-height:0}
.pnotice{margin:0 0 14px;padding:9px 13px;border-radius:7px;background:var(--amber-bg);
         border:1px solid var(--amber-line);font-family:var(--ui);font-size:13px;
         color:var(--amber);display:flex;justify-content:space-between;gap:10px;
         align-items:center;flex-wrap:wrap}
.pnotice button{border:1px solid var(--amber-line);background:#fff;color:var(--amber);
       border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}

/* ---------- passage typography ---------- */
.ptitle{text-align:center;font-size:19px;margin:6px 0 2px;font-family:var(--serif)}
.byline{text-align:center;font-style:italic;margin-bottom:16px;font-size:15px}
.phead{font-size:15.5px;font-style:italic;margin:20px 0 6px}
.pintro{font-style:italic;border-left:3px solid var(--rule);padding-left:14px;
        margin:6px 0 18px;color:#39445a}
.ppara{margin:11px 0;display:flex;gap:10px;align-items:flex-start}
.pnum{flex:none;width:20px;font-weight:700;font-size:13px;color:var(--ink-faint);
      font-family:var(--ui);padding-top:3px}
.pcredit,.pnote{font-size:13.5px;color:var(--ink-soft);font-style:italic;margin:12px 0 0}
.pnote{font-style:normal}
.stanza{margin:16px 0}
@media (max-width:900px){.stanza{font-size:14.5px}}
@media (max-width:620px){.stanza{font-size:12.5px;line-height:1.5}}
@media (max-width:430px){.stanza{font-size:11px}.pbody{padding-left:16px;padding-right:16px}}
.pline{display:flex;gap:12px}
.lnum{flex:none;width:22px;text-align:right;color:var(--ink-faint);font-size:12.5px;
      font-family:var(--ui);padding-top:3px}
.pfig{margin:18px 0;text-align:center}
.pfig img{max-width:100%;height:auto;border:1px solid var(--rule);border-radius:4px}

/* ---------- question body ---------- */
.stem{font-size:18.5px;line-height:1.58}
.stem p{margin:0 0 12px}
.stem ul{margin:10px 0 12px;padding-left:22px}
.stem blockquote{margin:12px 0;padding:12px 16px;background:#f7f9fc;
       border-left:3px solid #c3ccd9;border-radius:0 6px 6px 0;font-family:var(--serif);
       font-size:17px;line-height:1.55}
.disp{text-align:center;margin:18px 0;font-size:19px}
.disp.stack{line-height:2}
.qfig{text-align:center;margin:16px 0}
.stem svg{max-width:100%;height:auto}
.grid-in{margin-top:22px}
.grid-in label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);
     letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.grid-in input{width:230px;font-size:24px;font-family:inherit;font-weight:600;
     padding:11px 14px;border:1.5px solid var(--rule);border-radius:8px;color:var(--ink)}
.grid-in input:focus{outline:none;border-color:var(--accent);
     box-shadow:0 0 0 3px rgba(47,111,176,.16)}
.hint{font-size:13px;color:var(--ink-faint);margin-top:9px}
.qfig img{max-width:min(100%,470px);height:auto}
.frac{display:inline-block;vertical-align:middle;text-align:center;
      font-size:.92em;line-height:1.15;margin:0 2px}
.frac .num{display:block;padding:0 3px}
.frac .den{display:block;border-top:1px solid currentColor;padding:0 3px}
.ovl{border-top:1px solid currentColor}
sup{font-size:.72em;vertical-align:super;line-height:0}
sub{font-size:.72em;vertical-align:sub;line-height:0}
.tbl-title{text-align:center;font-size:14.5px;margin-bottom:7px;font-weight:600}
table.data{border-collapse:collapse;margin:0 auto 14px}
table.data th,table.data td{border:1px solid var(--ink);padding:5px 14px;
      font-size:15px;text-align:center}

/* ---------- choices ---------- */
.choices{margin-top:22px;display:flex;flex-direction:column;gap:9px}
.choice{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
        background:#fff;border:1.5px solid var(--rule);border-radius:8px;
        padding:13px 16px;cursor:pointer;font-size:17.5px;line-height:1.5;color:var(--ink);
        transition:border-color .12s,background .12s}
.choice:hover{border-color:#b9c4d4;background:#fafbfd}
.choice .ltr{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid #c3ccd9;
        display:flex;align-items:center;justify-content:center;font-size:13.5px;
        font-weight:700;color:var(--ink-soft);margin-top:1px}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.choice.on .ltr{background:var(--accent);border-color:var(--accent);color:#fff}
.choice:focus-visible{outline:3px solid #9dc3ec;outline-offset:2px}

/* ---------- actions ---------- */
.actions{display:flex;align-items:center;justify-content:space-between;gap:14px;
      margin-top:26px;padding-top:18px;border-top:1px solid var(--rule)}
.note{font-size:13px;color:var(--ink-faint);max-width:380px}
.btns{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:none;border-radius:8px;padding:13px 24px;font-size:16px;font-weight:600;
     cursor:pointer;transition:background .12s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-deep)}
.arrow.back{background:#fff;color:var(--ink-soft);border:1.5px solid var(--rule)}
.arrow.back:hover{background:#f3f5f9;color:var(--ink);border-color:var(--ink-soft)}
.setpos{font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);border-left:1px solid var(--rule);padding-left:10px}
@media (max-width:760px){.setpos{border-left:0;padding-left:0}}
.btn-ghost{background:none;color:var(--ink-soft);border:1.5px solid var(--rule);
     padding:12px 18px}
.btn-ghost:hover{background:#f3f5f9;color:var(--ink)}
.btn:focus-visible{outline:3px solid #9dc3ec;outline-offset:2px}
.arrow{width:60px;height:60px;border-radius:50%;border:none;background:var(--accent);
     color:#fff;font-size:27px;line-height:1;cursor:pointer;display:flex;
     align-items:center;justify-content:center;transition:background .12s,transform .12s}
.arrow:hover{background:var(--accent-deep);transform:translateX(2px)}
.arrow.finish{background:var(--ok)}
.arrow.finish:hover{background:#136c34;transform:none}
.arrow:focus-visible{outline:3px solid #9dc3ec;outline-offset:3px}

/* ---------- start / results ---------- */
.rules{list-style:none;padding:0;margin:0 0 6px}
.rules li{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule);
      font-size:16px;color:var(--ink-soft)}
.rules li:last-child{border-bottom:none}
.rules b{color:var(--ink);font-weight:650;flex:none;width:150px}
.picks{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 6px}
.pick{flex:1;min-width:210px;text-align:left;background:#fff;border:1.5px solid var(--rule);
      border-radius:10px;padding:16px 18px;cursor:pointer;transition:border-color .12s,background .12s}
.pick:hover{border-color:var(--accent);background:var(--accent-soft)}
.pick b{display:block;font-size:17px;margin-bottom:3px}
.pick span{font-size:13.5px;color:var(--ink-faint)}
.stats{display:flex;gap:34px;margin:6px 0 22px;flex-wrap:wrap}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint)}
.stat .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
table.sheet{width:100%;border-collapse:collapse;margin-top:6px}
table.sheet th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-faint);border-bottom:1.5px solid var(--rule);padding:8px 10px}
table.sheet td{border-bottom:1px solid #eef1f6;padding:8px 10px;font-size:15.5px;
      font-variant-numeric:tabular-nums}
table.sheet td.q{color:var(--ink-faint);width:52px}
.blank{color:var(--danger);font-weight:650}
.right{color:var(--ok);font-weight:650}
.wrong{color:var(--danger);font-weight:650}
.missed{font-size:16.5px;font-weight:600;color:var(--danger);margin:0 0 4px;
      font-variant-numeric:tabular-nums;line-height:1.6}
.sheetgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 26px}
@media(max-width:800px){.sheetgrid{grid-template-columns:1fr}}

/* ---------- dialog / print ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(16,24,38,.55);
      display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.modal-card{background:#fff;border-radius:12px;padding:26px 28px;max-width:430px;width:100%;
      box-shadow:0 18px 50px rgba(10,18,32,.3)}
.modal-card h3{margin:0 0 8px;font-size:18px}
.modal-card p{margin:0 0 20px;color:var(--ink-soft);font-size:15px}
.modal-btns{display:flex;justify-content:flex-end;gap:10px}
.printhead{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.ph-title{font-size:15px;font-weight:700}
.ph-meta{font-size:13px;color:var(--ink-soft);margin-top:3px}
.namefield{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.namefield label{font-size:13px;font-weight:600;color:var(--ink-soft);width:104px}
.namefield input{flex:1;min-width:210px;max-width:300px;font-family:var(--ui);font-size:15px;
      padding:8px 12px;border:1.5px solid #c3ccd9;border-radius:8px}
.namefield input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tip{font-size:12.5px;color:var(--ink-faint);margin-top:10px}

@media(max-width:900px){
  .split{grid-template-columns:1fr}
  .pane.passage{position:static;max-height:52vh}
  .pane.qs{padding:22px 20px}
}
@media(max-width:640px){
  .card{padding:22px 18px}
  .bar-in{padding:9px 14px}.wrap{padding:0 12px}
  h1{font-size:22px}.stem,.choice{font-size:16.5px}
  .actions{flex-direction:column;align-items:stretch}
  .btns{justify-content:space-between}.note{max-width:none}
  .arrow{width:54px;height:54px;font-size:25px}
  .rules b{width:auto}
  .rules li{flex-direction:column;gap:2px}
}
@media print{
  @page{margin:14mm}
  .bar,.track,.actions,.noprint,.modal,.namefield{display:none!important}
  body{background:#fff;font-size:12px}
  .wrap{max-width:none;padding:0}
  .card{border:none;margin:0;padding:0;border-radius:0}
  h1{font-size:18px;margin-bottom:6px}
  h2{font-size:13px;margin:14px 0 6px}
  .stats{gap:24px;margin:4px 0 12px}.stat .v{font-size:19px}
  .sheetgrid{gap:0 18px}
  table.sheet td,table.sheet th{padding:2.5px 7px;font-size:11px}
  tr{page-break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header class="bar" id="bar" hidden>

    <div class="brand">SHSAT Practice <span id="secname"></span></div>
    <div class="count" id="count"></div>
  </div>
</header>
<div class="track" id="track" hidden><i id="trackbar" style="width:0%"></i></div>
<main id="app"></main>

</div>

<script>
(function(){
"use strict";

var DATA = {"sections": [{"key": "ela", "label": "English Language Arts", "blurb": "Five reading texts with questions, then five Revising and Editing questions. Within a set of questions about one text you may move back and forth; submitting the last question of a set closes it.", "items": [{"sec": "ela", "n": 1, "type": "mc", "text": "wells", "grp": "wells", "stem": "<p>Which sentence best supports the idea that a major calamity threatens human existence?</p>", "choices": [{"l": "A", "h": "&ldquo;In a small white phial there still remained a little of the drug that had kept him awake and active for four long nights.&rdquo; (paragraph 1)"}, {"l": "B", "h": "&ldquo;Halfway up the sky, over the clustering roofs, chimneys and steeples of the city, hung the star.&rdquo; (paragraph 1)"}, {"l": "C", "h": "&ldquo;It would seem, gentlemen, if I may put the thing clearly and briefly, that&mdash;Man has lived in vain.&rdquo; (paragraph 2)"}, {"l": "D", "h": "&ldquo;And the streets and houses were alight in all the cities, the shipyards glared, and whatever roads led to high country were lit and crowded all night long.&rdquo; (paragraph 7)"}], "answer": "C", "why": "Only this sentence states a threat to humanity itself; the others describe the drug, the star's position, or the aftermath."}, {"sec": "ela", "n": 2, "type": "mc", "text": "wells", "grp": "wells", "stem": "<p>How do the repeated references to the mathematician&rsquo;s use of a drug contribute to the development of ideas in the passage?</p>", "choices": [{"l": "E", "h": "It foreshadows that the professor&rsquo;s judgement was impaired and his calculations are therefore not to be trusted."}, {"l": "F", "h": "It hints at how the professor used a sleeping aid to help him relax from the terror brought on by his discovery."}, {"l": "G", "h": "It references how many people during this time period used addictive substances."}, {"l": "H", "h": "It conveys the significance of the professor&rsquo;s work as he could not afford to sleep before its completion."}], "answer": "H", "why": "The drug &ldquo;kept him awake and active for four long nights&rdquo; so he could finish the calculation &mdash; a measure of how urgent the work was."}, {"sec": "ela", "n": 3, "type": "mc", "text": "wells", "grp": "wells", "stem": "<p>Read these sentences from paragraph 2.</p><blockquote>[He] carefully selected a large piece of chalk. It was a joke among his students that he could not lecture without that piece of chalk to fumble in his fingers, and once he had been stricken to impotence by their hiding his supply.</blockquote><p>The sentences contribute to the development of ideas in the passage by</p>", "choices": [{"l": "A", "h": "describing the fussy nature of the professor in order to show that his students did not respect him."}, {"l": "B", "h": "laying the foundation for a contrast between the typical school day routine and the professor&rsquo;s extraordinary news."}, {"l": "C", "h": "alluding to the professor&rsquo;s distress over the implications of his calculations by showing him fidgeting with the chalk."}, {"l": "D", "h": "showing that the professor needed to handle the chalk in order to teach as it was coated with the drug that he kept using."}], "answer": "B", "why": "The chalk is a long-standing habit and a student joke &mdash; ordinary routine set directly against the announcement that follows."}, {"sec": "ela", "n": 4, "type": "mc", "text": "wells", "grp": "wells", "stem": "<p>How does paragraph 3 fit into the overall structure of the excerpt?</p>", "choices": [{"l": "E", "h": "It highlights the confusion the students feel while trying to catch on to what the professor is telling them."}, {"l": "F", "h": "It establishes that the students are immediately riveted by the professor&rsquo;s announcement."}, {"l": "G", "h": "It showcases the obvious distress, panic, and fear that the students feel toward the professor&rsquo;s announcement."}, {"l": "H", "h": "It showcases how completely uninterested the students are in the professor&rsquo;s lecture."}], "answer": "E", "why": "&ldquo;Had they heard aright? Mad?&rdquo; plus raised eyebrows and grinning lips show confusion, not rapt attention, panic, or indifference."}, {"sec": "ela", "n": 5, "type": "mc", "text": "wells", "grp": "wells", "stem": "<p>The phrase &ldquo;circumstances beyond [his] control&rdquo; in paragraph 2 conveys the idea that</p>", "choices": [{"l": "A", "h": "the frail old professor has fallen ill and is unable to finish teaching the term."}, {"l": "B", "h": "the professor&rsquo;s miscalculation may have actually contributed to the collision that is about to take place."}, {"l": "C", "h": "the professor is a man who favors exacting precision in his life yet is unable to prevent the calamity that is unfolding."}, {"l": "D", "h": "the professor is not really to blame for the calamity despite his obvious guilt."}], "answer": "C", "why": "The understated phrase comes from a man of habit and precision who can calculate the catastrophe but do nothing about it."}, {"sec": "ela", "n": 6, "type": "mc", "text": "wells", "grp": "wells", "stem": "<p>Which sentence best supports the idea that the professor is &ldquo;serene, explicit, patient as ever&rdquo; despite the looming calamity?</p>", "choices": [{"l": "E", "h": "&ldquo;He looked at the little phial. &lsquo;There will be no need of sleep again,&rsquo; he said.&rdquo; (paragraph 2)"}, {"l": "F", "h": "&ldquo;It was a joke among his students that he could not lecture without that piece of chalk to fumble in his fingers, and once he had been stricken to impotence by their hiding his supply.&rdquo; (paragraph 2)"}, {"l": "G", "h": "&ldquo;He came and looked under his grey eyebrows at the rising tiers of young fresh faces, and spoke with his accustomed studied commonness of phrasing.&rdquo; (paragraph 2)"}, {"l": "H", "h": "&ldquo;And overhead, growing larger and brighter as the earth rolled on its way and the night passed, rose the dazzling star.&rdquo; (paragraph 6)"}], "answer": "G", "why": "&ldquo;Accustomed studied commonness of phrasing&rdquo; shows him delivering the news in his usual unhurried manner."}, {"sec": "ela", "n": 7, "type": "mc", "text": "wells", "grp": "wells", "stem": "<p>How does the author&rsquo;s description of wakefulness in paragraph 6 contribute to the development of ideas in the passage?</p>", "choices": [{"l": "A", "h": "It highlights how the cosmic rays were preventing people from sleeping."}, {"l": "B", "h": "It establishes that the people everywhere were aware of what was about to happen."}, {"l": "C", "h": "It conveys how people under stress take substances to prevent them from sleeping."}, {"l": "D", "h": "It foreshadows how the human race was in denial about the events to come."}], "answer": "B", "why": "&ldquo;Everywhere the world was awake that night&rdquo; and bells &ldquo;throughout Christendom&rdquo; show the warning has reached everyone."}, {"sec": "ela", "n": 8, "type": "mc", "text": "wells", "grp": "wells", "stem": "<p>Read this sentence from paragraph 6.</p><blockquote>It was the tolling of the bells in a million belfry towers and steeples, summoning the people to sleep no more, to sin no more, but to gather in their churches and pray.</blockquote><p>The sentence contributes to the development of ideas in the passage by</p>", "choices": [{"l": "E", "h": "suggesting there is a religious revival taking place."}, {"l": "F", "h": "confirming that there is to be an important meeting for all to attend."}, {"l": "G", "h": "explaining how the noise of the bells, bees, and clamoring voice prohibit sleep."}, {"l": "H", "h": "conveying that people are likely to soon face death."}], "answer": "H", "why": "Being summoned to &ldquo;sin no more&rdquo; and pray is how people behave when they believe the end is coming &mdash; the bells signal impending death, not a revival."}, {"sec": "ela", "n": 9, "type": "mc", "text": "beston", "grp": "beston", "stem": "<p>In paragraph 4, the phrase &ldquo;a household god, and a friend&rdquo; conveys the idea that</p>", "choices": [{"l": "A", "h": "the fireplace proved to be the most practical and reliable feature of the small house."}, {"l": "B", "h": "the author knew that his unusual heating arrangement would strike other people as foolish."}, {"l": "C", "h": "the fire came to mean something to the author beyond its usefulness in heating the house."}, {"l": "D", "h": "the author came to prefer the company of the fire to that of the few people nearby."}], "answer": "C", "why": "FUNCTION. The sentence says the fire was &ldquo;more than a source of heat,&rdquo; so the phrase marks the moment a practical object becomes something revered and companionable. TRAPS &mdash; Distortion: &ldquo;most practical and reliable feature&rdquo; keeps the fire inside the usefulness the sentence explicitly goes past. Misused Detail: &ldquo;would strike other people as foolish&rdquo; restates the clause immediately before the phrase (&ldquo;sounds demented&rdquo;) &mdash; true, but it answers a different question. Out of Scope: &ldquo;prefer the company of the fire&rdquo; is never claimed; this is the distractor to watch, since &ldquo;friend&rdquo; really does mean companionship."}, {"sec": "ela", "n": 10, "type": "mc", "text": "beston", "grp": "beston", "stem": "<p>Read these sentences from paragraph 2.</p><blockquote>When I began to build, I had no notion whatever of using the house as a dwelling place. I simply wanted a place to come to in the summer, one cosy enough to be visited in winter could I manage to get down.</blockquote><p>The sentences contribute to the overall structure of the excerpt by</p>", "choices": [{"l": "E", "h": "establishing an intention that the author states plainly and that the end of the excerpt reverses."}, {"l": "F", "h": "showing that the author&rsquo;s plans for the house changed while the carpenters were at work."}, {"l": "G", "h": "introducing a desire for solitude that grows more important as the excerpt goes on."}, {"l": "H", "h": "emphasizing the author&rsquo;s uncertainty about whether he could reach the house in winter."}], "answer": "E", "why": "FUNCTION. He says outright that he never meant to live there; the excerpt closes with him deciding to stay a year, so these sentences exist to be overturned. TRAPS &mdash; Opposite: the plans did not change during construction &mdash; he drew them himself and &ldquo;my neighbour built well.&rdquo; Out of Scope: solitude is never given as the reason he wanted the house. Distortion: &ldquo;could I manage to get down&rdquo; is about reaching the place, not doubt about the house, and paragraph 3 settles it anyway."}, {"sec": "ela", "n": 11, "type": "mc", "text": "beston", "grp": "beston", "stem": "<p>The author&rsquo;s description of the windows in paragraph 3 reveals that he</p>", "choices": [{"l": "A", "h": "regarded the number of windows as a mistake that he corrected by adding shutters."}, {"l": "B", "h": "wanted the rooms to feel as open to the weather as possible at all times."}, {"l": "C", "h": "preferred the eastern view of the sea to the western view of the marshes."}, {"l": "D", "h": "valued being able to control how much of the outdoors came into the house."}], "answer": "D", "why": "INFERENCE. The shutters let him have &ldquo;either the most sheltered and darkened of rooms or something rather like an inside out-of-doors.&rdquo; The point is the range he can choose between, not either end of it. TRAPS &mdash; Distortion: the passage does use the word &ldquo;misgiving,&rdquo; but it is one he anticipates in the reader and answers, not a mistake he admits; this is the strongest distractor in the item. Opposite: &ldquo;as open as possible at all times&rdquo; is contradicted by shutters &ldquo;found necessary through the year.&rdquo; Out of Scope: he lists both views and prefers neither."}, {"sec": "ela", "n": 12, "type": "mc", "text": "beston", "grp": "beston", "stem": "<p>How does the location of the house affect the author&rsquo;s daily life, as described in paragraph 5?</p>", "choices": [{"l": "E", "h": "Because the sandy trail is unreliable, he depends primarily on a neighbour&rsquo;s horse and cart."}, {"l": "F", "h": "Because the dunes are hard to cross, he does without fresh food such as milk and eggs."}, {"l": "G", "h": "Having no road to reach the house, he must carry most of his supplies in on foot."}, {"l": "H", "h": "Living so far from the village, he must go without supplies for weeks at a time."}], "answer": "G", "why": "DETAIL. &ldquo;There is no road through the dunes,&rdquo; and the knapsack is &ldquo;the only ever-ready wagon of the dunes.&rdquo; TRAPS &mdash; Distortion: &ldquo;primarily&rdquo; is the whole error &mdash; the horse and cart helps &ldquo;were but occasional.&rdquo; Opposite: he packs milk, eggs, butter and rolls down the beach. Extreme: a friend drove him to the shops twice a week, so &ldquo;weeks at a time&rdquo; overstates the isolation. Both Opposite and Extreme catch the student who reads &ldquo;remote&rdquo; as &ldquo;entirely cut off.&rdquo;"}, {"sec": "ela", "n": 13, "type": "mc", "text": "beston", "grp": "beston", "stem": "<p>Which sentence from paragraph 6 best supports the idea that the author&rsquo;s surroundings separate him from human society while immersing him in the natural world?</p>", "choices": [{"l": "A", "h": "&ldquo;The top of the mound I built on stands scarce twenty feet above high-water mark, and only thirty in from the great beach.&rdquo;"}, {"l": "B", "h": "&ldquo;The coast guards at Nauset, a scant two miles away, were my only neighbours.&rdquo;"}, {"l": "C", "h": "&ldquo;North, and north alone, had I touch with human things.&rdquo;"}, {"l": "D", "h": "&ldquo;On its solitary dune my house faced the four walls of the world.&rdquo;"}], "answer": "D", "why": "DETAIL, with a compound criterion. Only this sentence answers both halves: &ldquo;solitary&rdquo; gives the separation from people, and a house facing &ldquo;the four walls of the world&rdquo; gives the immersion in nature. TRAPS &mdash; every wrong option satisfies exactly one half, so a student who reads only the first part of the stem still finds something that fits. The &ldquo;north, and north alone&rdquo; sentence is the strongest: it implies the other three directions hold nothing human, but it only negates human contact and never names the natural world. The mound sentence gives the natural setting with no separation; the coast guards sentence gives the separation with no natural setting."}, {"sec": "ela", "n": 14, "type": "mc", "text": "beston", "grp": "beston", "stem": "<p>Read this sentence from paragraph 7.</p><blockquote>The world to-day is sick to its thin blood for lack of elemental things, for fire before the hands, for water welling from the earth, for air, for the dear earth itself underfoot.</blockquote><p>How does the sentence develop a central idea of the excerpt?</p>", "choices": [{"l": "E", "h": "It emphasizes that modern comforts have weakened people&rsquo;s ability to endure hardship outdoors."}, {"l": "F", "h": "It explains that the author moved to the beach in order to recover his own health."}, {"l": "G", "h": "It claims that people today live cut off from the basic forces of the natural world."}, {"l": "H", "h": "It argues that people can recover their well-being only by giving up modern conveniences."}], "answer": "G", "why": "GLOBAL. The sentence turns his own case into a diagnosis of the modern world, and the list that follows &mdash; fire, water, air, earth &mdash; names exactly what he found on the dune. TRAPS &mdash; Misused Detail: &ldquo;recover his own health&rdquo; takes &ldquo;sick to its thin blood&rdquo; literally, and writers of the period really did move to the coast for their health; the passage says he stayed for &ldquo;the beauty and mystery of this earth and outer sea.&rdquo; Extreme: &ldquo;only by giving up modern conveniences&rdquo; goes further than he does. Distortion: the passage describes a lack of contact, not a loss of toughness."}, {"sec": "ela", "n": 15, "type": "mc", "text": "beston", "grp": "beston", "stem": "<p>The sensory language &ldquo;the arched sky has an ocean vastness&rdquo; and &ldquo;the clouds are now of ocean, now of earth&rdquo; in paragraph 1 conveys</p>", "choices": [{"l": "A", "h": "the way the landscape changes in appearance as weather moves between sea and land."}, {"l": "B", "h": "the scale of the place and the way sea and sky seem to run together there."}, {"l": "C", "h": "the author&rsquo;s doubt that he could live comfortably in so open and exposed a place."}, {"l": "D", "h": "the impression that the ocean is so vast that the land beside it hardly matters."}], "answer": "B", "why": "FUNCTION. The sky is measured in the ocean&rsquo;s terms and the clouds belong to both, so the language collapses the usual boundary between them and makes the place feel immense. TRAPS &mdash; Distortion: reading the figurative clouds as a report on changing weather. Out of Scope: paragraph 1 contains no hesitation; that is imported from later in the excerpt. Extreme: the passage never diminishes the land &mdash; the same sentence gives it equal weight, &ldquo;now of ocean, now of earth.&rdquo;"}, {"sec": "ela", "n": 16, "type": "mc", "text": "beston", "grp": "beston", "stem": "<p>The author develops his point of view toward the house and the beach chiefly by</p>", "choices": [{"l": "E", "h": "tracing how his expectations of the house change as he grows familiar with the beach."}, {"l": "F", "h": "contrasting his own life on the dune with the lives of the villagers who live inland."}, {"l": "G", "h": "listing the hardships of each winter in order to show how much he was able to endure."}, {"l": "H", "h": "describing plain, practical details and then revealing what those details came to mean to him."}], "answer": "H", "why": "GLOBAL. Windows, shutters, a knapsack and a fireplace arrive as carpentry and errands, then turn into an &ldquo;inside out-of-doors,&rdquo; a &ldquo;wagon of the dunes&rdquo; and a &ldquo;household god&rdquo; &mdash; the pattern runs through the whole excerpt. TRAPS &mdash; Misused Detail: his expectations do change, but that is what happens in the excerpt, not the technique the question asks about. Out of Scope: the villagers appear once, wary of the trail, and their lives are never described. Extreme: the excerpt stops before the year begins, so there are no winters to list."}, {"sec": "ela", "n": 17, "type": "mc", "text": "serpent", "grp": "serpent", "stem": "<p>How does the poem&rsquo;s form contribute to the poem&rsquo;s meaning?</p>", "choices": [{"l": "A", "h": "The uneven line lengths emphasize the variety of ways people interpret the meaning of the mound."}, {"l": "B", "h": "The dashes throughout the poem highlight the speaker&rsquo;s changing thoughts about the significance of the mound."}, {"l": "C", "h": "The lack of a regular rhyme scheme and meter convey that the speaker struggles to comprehend the vastness of the mound."}, {"l": "D", "h": "The use of one continuous stanza and the pattern of the lines mimic the long and winding shape of the mound."}], "answer": "D", "why": "The poem runs as a single unbroken stanza, echoing the serpent&rsquo;s long, undulating body."}, {"sec": "ela", "n": 18, "type": "mc", "text": "serpent", "grp": "serpent", "stem": "<p>Which lines reveal how the setting affects the speaker and the men from the museum?</p>", "choices": [{"l": "E", "h": "&ldquo;It being winter, / there was little underbrush to speak of&mdash;&rdquo; (lines 8&ndash;9)"}, {"l": "F", "h": "&ldquo;but the winter silence of the creek pressed / down on all of us like a weight.&rdquo; (lines 14&ndash;15)"}, {"l": "G", "h": "&ldquo;The humps in the ground were all but / invisible until you were right up on them.&rdquo; (lines 16&ndash;17)"}, {"l": "H", "h": "&ldquo;In the summer the creek bottom was crowded / with so much life that you could trip&rdquo; (lines 21&ndash;22)"}], "answer": "F", "why": "&ldquo;All of us&rdquo; includes the speaker and the men, and the silence &ldquo;pressed down&rdquo; on them &mdash; setting acting on people."}, {"sec": "ela", "n": 19, "type": "mc", "text": "serpent", "grp": "serpent", "stem": "<p>Lines 1&ndash;2 contribute to the development of ideas in the poem by</p>", "choices": [{"l": "A", "h": "suggesting that the men are too busy with their work to talk to the speaker."}, {"l": "B", "h": "hinting that the men have hidden motives for studying the mound."}, {"l": "C", "h": "indicating why the speaker is fascinated by the men and wants to help them."}, {"l": "D", "h": "helping establish the reason for the men&rsquo;s visit and purposeful behavior."}], "answer": "D", "why": "&ldquo;Measuring tapes and sketchbooks&rdquo; identify them at once as men who came to survey and record the mound."}, {"sec": "ela", "n": 20, "type": "mc", "text": "serpent", "grp": "serpent", "stem": "<p>Read line 28 from the poem.</p><blockquote>earth. At the mouth end, there was an oval mound</blockquote><p>How does the line contribute to the development of ideas in the poem?</p>", "choices": [{"l": "E", "h": "It introduces a feature of the mound that has a different meaning to different people."}, {"l": "F", "h": "It describes a feature of the mound that the men from the museum need to document."}, {"l": "G", "h": "It introduces a comparison of the body of the mound with the head of the mound."}, {"l": "H", "h": "It describes a part of the mound that is difficult to see from far away."}], "answer": "E", "why": "The oval mound is read three ways: an egg (Pa), the sun being swallowed (the museum man), and the serpent singing (Ruth)."}, {"sec": "ela", "n": 21, "type": "mc", "text": "serpent", "grp": "serpent", "stem": "<p>What impact do the phrases &ldquo;all but / invisible&rdquo; and &ldquo;even less obvious&rdquo; in lines 16&ndash;18 have on the meaning of the poem?</p>", "choices": [{"l": "A", "h": "They indicate that viewing the full size and shape of the mound is difficult."}, {"l": "B", "h": "They suggest that the location of the mound is unknown to most people."}, {"l": "C", "h": "They imply that the speaker wants the location of the mound to remain a secret."}, {"l": "D", "h": "They reveal that the speaker is unfamiliar with the significance of the mound."}], "answer": "A", "why": "Both phrases describe how hard the shape is to perceive &mdash; which is why the speaker has to climb a tree to see the whole figure."}, {"sec": "ela", "n": 22, "type": "mc", "text": "serpent", "grp": "serpent", "stem": "<p>What impact do the words &ldquo;swish,&rdquo; &ldquo;chitter,&rdquo; and &ldquo;cry&rdquo; in lines 12&ndash;13 have in the poem?</p>", "choices": [{"l": "E", "h": "They indicate the variety of wildlife found in the area around the mound."}, {"l": "F", "h": "They illustrate how lively the mound&rsquo;s surroundings are during the summer."}, {"l": "G", "h": "They show how the mound disrupts natural life in the marsh."}, {"l": "H", "h": "They suggest that the speaker prefers the mound&rsquo;s appearance in winter."}], "answer": "E", "why": "Beaver, chickadee, and hawk name the range of animals living around the creek &mdash; creatures the speaker listens for but does not hear in the winter silence."}, {"sec": "ela", "n": 23, "type": "mc", "text": "serpent", "grp": "serpent", "stem": "<p>How does the speaker&rsquo;s interaction with Ruth in lines 37&ndash;41 convey a central idea of the poem?</p>", "choices": [{"l": "A", "h": "It suggests that the most accurate interpretations of the mound come from knowing the purpose of the mound."}, {"l": "B", "h": "It reveals the benefit of considering different interpretations of the mound&rsquo;s significance."}, {"l": "C", "h": "It emphasizes that there are multiple interpretations of the mound based on feelings and experiences."}, {"l": "D", "h": "It implies that scientific study of the mound&rsquo;s purpose will affect what the mound symbolizes to people."}], "answer": "C", "why": "Ruth&rsquo;s reading joins Pa&rsquo;s and the museum man&rsquo;s, each shaped by what that person brings to the mound."}, {"sec": "ela", "n": 24, "type": "mc", "text": "serpent", "grp": "serpent", "stem": "<p>The poet contrasts the speaker&rsquo;s and Ruth&rsquo;s points of view regarding the mound by using dialogue to</p>", "choices": [{"l": "E", "h": "imply that Ruth is worried that her interpretation of the mound will be seen as too abstract."}, {"l": "F", "h": "show that Ruth has already decided on her interpretation of the mound."}, {"l": "G", "h": "indicate that Ruth hopes her interpretation of the mound will be shared by the men from the museum."}, {"l": "H", "h": "suggest that Ruth wants the speaker to agree with her interpretation of the mound."}], "answer": "F", "why": "&ldquo;She disagreed,&rdquo; &ldquo;she insisted,&rdquo; and &ldquo;Not swallowing, singing&rdquo; present a settled conviction, not an attempt to persuade."}, {"sec": "ela", "n": 25, "type": "mc", "text": "memory", "grp": "memory", "stem": "<p>The details in paragraph 3 about cognitive offloading convey a central idea of the passage by</p>", "choices": [{"l": "A", "h": "demonstrating how the methods used to store and find information have changed over time."}, {"l": "B", "h": "suggesting that reliance on the Internet for information is inevitable."}, {"l": "C", "h": "explaining how encyclopedias and the Internet are similar sources of information."}, {"l": "D", "h": "implying that more information can be understood now than ever before."}], "answer": "A", "why": "The paragraph traces the shift from encyclopedias to the Internet as an &ldquo;extended memory&rdquo; &mdash; a change in method over time."}, {"sec": "ela", "n": 26, "type": "mc", "text": "memory", "grp": "memory", "stem": "<p>How do the details about the experiment described in paragraph 5 convey a central idea of the passage?</p>", "choices": [{"l": "E", "h": "They suggest that the act of repeating information by typing it on a keyboard may improve a person&rsquo;s memory."}, {"l": "F", "h": "They suggest that memory is affected by whether a person expects to have access to the information in the future."}, {"l": "G", "h": "They explain that a person will forget information faster if the information is considered unimportant."}, {"l": "H", "h": "They indicate that a person may start to forget details when the amount of information becomes overwhelming."}], "answer": "F", "why": "The only variable was whether participants expected the file to be saved; those who thought it would be erased recalled 40 percent more."}, {"sec": "ela", "n": 27, "type": "mc", "text": "memory", "grp": "memory", "stem": "<p>Read this sentence from paragraph 7.</p><blockquote>As the Internet&rsquo;s resources continue to expand our &ldquo;external&rdquo; memory, some question whether the process may cause people to depend too heavily on technology.</blockquote><p>How does the sentence contribute to the structure and development of ideas in the passage?</p>", "choices": [{"l": "A", "h": "It presents a claim about the risks of relying on the Internet that prompted the research described in paragraphs 2 and 6."}, {"l": "B", "h": "It signals a shift from a neutral viewpoint in paragraphs 2 and 6 to a presentation of an argument and a counterargument."}, {"l": "C", "h": "It contrasts a disadvantage of relying on the Internet with the benefits of Internet use that are described in paragraphs 2 and 6."}, {"l": "D", "h": "It introduces a counterargument and marks a transition from an optimistic tone in paragraphs 2 and 6 to a cautious tone as the counterargument is developed."}], "answer": "B", "why": "Paragraphs 2 and 6 report findings neutrally; this sentence raises a concern and Pinker&rsquo;s quotation answers it, giving argument and counterargument."}, {"sec": "ela", "n": 28, "type": "mc", "text": "memory", "grp": "memory", "stem": "<p>The study described in paragraph 6 influenced researchers&rsquo; ideas about memory in the digital age by</p>", "choices": [{"l": "E", "h": "highlighting instances when organizing detailed information made it easier to remember."}, {"l": "F", "h": "confirming that keywords can be remembered more easily than large amounts of information."}, {"l": "G", "h": "identifying a shift in focus from remembering specific information to knowing where to find it."}, {"l": "H", "h": "emphasizing that remembering a basic idea is more important than storing detailed information."}], "answer": "G", "why": "Participants identified 49 percent of folder locations but only 23 percent of the facts, so memory prioritized where over what."}, {"sec": "ela", "n": 29, "type": "mc", "text": "memory", "grp": "memory", "stem": "<p>How does the diagram provide additional support for the topic presented in the passage?</p>", "choices": [{"l": "A", "h": "It reveals why human brains must adapt to obtaining information from the Internet as opposed to other sources."}, {"l": "B", "h": "It indicates how people can use the Internet to help improve their long-term recollection of information."}, {"l": "C", "h": "It shows how study participants&rsquo; brains distinguished between important and unimportant details."}, {"l": "D", "h": "It depicts the idea that repetition and rehearsal are necessary to recall information when tools such as search engines are unavailable."}], "answer": "D", "why": "The diagram shows rehearsal as the only route from short-term to long-term memory, and unrehearsed information being forgotten."}, {"sec": "ela", "n": 30, "type": "mc", "text": "memory", "grp": "memory", "stem": "<p>Which evidence from the passage is most relevant to the claim in paragraph 7 that &ldquo;far from making us stupid, these technologies are the only things that will keep us smart&rdquo;?</p>", "choices": [{"l": "E", "h": "the revelation that most people opted to use the Internet to answer relatively easy trivia questions rather than relying on their own brainpower (paragraph 2)"}, {"l": "F", "h": "the assertion that the storage of information on the Internet frees people to focus on higher-order tasks such as problem solving (paragraph 3)"}, {"l": "G", "h": "the connection between how people organize information in their mind and their ability to recall that information (paragraph 5)"}, {"l": "H", "h": "the description of transactive memory as an expansive external source that people can use to store information (paragraph 6)"}], "answer": "F", "why": "Pinker&rsquo;s claim is that the technology makes us smarter; paragraph 3&rsquo;s point about minds being freed for &ldquo;other cognitive feats&rdquo; is the direct support."}, {"sec": "ela", "n": 31, "type": "mc", "text": "memory", "grp": "memory", "stem": "<p>Which sentence from the passage suggests that using Internet search engines may lead people to rely less on their own ability to recall information?</p>", "choices": [{"l": "A", "h": "&ldquo;In the past few decades, the Internet has become an integral component of daily life for many people.&rdquo; (paragraph 1)"}, {"l": "B", "h": "&ldquo;The Internet group was required to use the search engine Google to answer eight challenging trivia questions.&rdquo; (paragraph 2)"}, {"l": "C", "h": "&ldquo;Their results showed that 83 percent of the Internet group continued to consult Google in the second round, while only 63 percent of the memory group chose to do so.&rdquo; (paragraph 2)"}, {"l": "D", "h": "&ldquo;For this experiment, participants read forty trivia facts, such as &lsquo;An ostrich&rsquo;s eye is bigger than its brain,&rsquo; and typed the statements into a computer file.&rdquo; (paragraph 5)"}], "answer": "C", "why": "The 83-versus-63-percent gap is the passage&rsquo;s one piece of evidence that prior searching makes people reach for a search engine instead of their own recall."}, {"sec": "ela", "n": 32, "type": "mc", "text": "memory", "grp": "memory", "stem": "<p>The effect of the Internet on a person&rsquo;s memory is illustrated in the passage through the presentation of studies that</p>", "choices": [{"l": "E", "h": "highlight the difference between the capacity of the Internet and the ability of the human brain to locate information."}, {"l": "F", "h": "compare the type of information that can be obtained from the Internet with the type of information that is stored in the human brain."}, {"l": "G", "h": "emphasize the ease of obtaining information through search engines rather than remembering it without assistance."}, {"l": "H", "h": "examine how the use of search engines changes the way people evaluate and store information for future access."}], "answer": "H", "why": "All three studies test how searching changes what people judge worth remembering and how they store it &mdash; evaluation and storage."}, {"sec": "ela", "n": 33, "type": "mc", "text": "orwell", "grp": "orwell", "stem": "<p>The use of chronological structure contributes to the development of the ideas in the passage by</p>", "choices": [{"l": "A", "h": "showing how the events in Orwell&rsquo;s life contributed to the themes of his literature."}, {"l": "B", "h": "explaining why Orwell struggled during his experiences abroad in India and Spain."}, {"l": "C", "h": "showing the process by which Orwell finally became an enormously successful writer."}, {"l": "D", "h": "illustrating the reasons why Orwell found little success as a writer early in his career."}], "answer": "A", "why": "Each stage &mdash; India, London&rsquo;s slums, Spain &mdash; is tied to the writing it produced, ending with <i>Nineteen Eighty-Four</i>."}, {"sec": "ela", "n": 34, "type": "mc", "text": "orwell", "grp": "orwell", "stem": "<p>How does paragraph 1 introduce the idea that George Orwell was not immediately successful as a writer?</p>", "choices": [{"l": "E", "h": "through describing the writing assignments he took as lacking creative possibility"}, {"l": "F", "h": "through mentioning the struggles that marked his final, bedridden days"}, {"l": "G", "h": "by noting that he wrote seriously for fifteen years before achieving fame"}, {"l": "H", "h": "by noting that <i>Animal Farm</i> established his reputation for shrewd political commentary"}], "answer": "G", "why": "The fifteen-year gap between serious writing and fame is what establishes the delay; the other details describe the struggle rather than introduce it."}, {"sec": "ela", "n": 35, "type": "mc", "text": "orwell", "grp": "orwell", "stem": "<p>Read this sentence from paragraph 2.</p><blockquote>But feeling that he did not fit in, Orwell ultimately returned to India&mdash;following in his father&rsquo;s footsteps&mdash;rather than study further in England.</blockquote><p>The sentence contributes to the development of ideas in the passage by</p>", "choices": [{"l": "A", "h": "illustrating Orwell&rsquo;s desire to work instead of continuing his education."}, {"l": "B", "h": "showing that Orwell longed to return to the land of his childhood."}, {"l": "C", "h": "revealing that Orwell accepted British domination over India."}, {"l": "D", "h": "demonstrating Orwell&rsquo;s interest in continuing his father&rsquo;s work."}], "answer": "A", "why": "The sentence sets returning to India against studying &ldquo;further in England&rdquo; &mdash; he chose work over more schooling."}, {"sec": "ela", "n": 36, "type": "mc", "text": "orwell", "grp": "orwell", "stem": "<p>Read this sentence from paragraph 4.</p><blockquote>After more than 100 days on the front lines, Orwell was promoted to second lieutenant, given command of more than 30 men&mdash;and wounded by a sniper.</blockquote><p>How does the author&rsquo;s use of the dash at the end of the sentence contribute to the development of ideas in the passage?</p>", "choices": [{"l": "E", "h": "It emphasizes the rapid progress Orwell made during this time of his life."}, {"l": "F", "h": "It describes an event that reinforced the ideas guiding Orwell&rsquo;s life."}, {"l": "G", "h": "It suggests that Orwell&rsquo;s injury brought his time in Spain to an end."}, {"l": "H", "h": "It adds another of the struggles that the first paragraph introduced."}], "answer": "H", "why": "The dash breaks a list of advancements to land on a wound, extending paragraph 1&rsquo;s &ldquo;struggle of one kind or another.&rdquo;"}, {"sec": "ela", "n": 37, "type": "mc", "text": "orwell", "grp": "orwell", "stem": "<p>Which sentence from the passage best supports the idea that Orwell&rsquo;s books reflect his personal beliefs?</p>", "choices": [{"l": "A", "h": "&ldquo;He was distinguished among his classmates by his brilliance and his relative poverty, both of which affected his life and his choices.&rdquo; (paragraph 2)"}, {"l": "B", "h": "&ldquo;Again, Orwell struggled, this time with the clash between his responsibilities as a bureaucrat of the British government and his growing disillusionment with the concept of imperialism.&rdquo; (paragraph 3)"}, {"l": "C", "h": "&ldquo;Once there, however, he quickly abandoned his responsibilities as a journalist and joined the communist Republican Army in its struggle against the Nationalists.&rdquo; (paragraph 4)"}, {"l": "D", "h": "&ldquo;Nevertheless, the ideological shift inspired his crowning literary achievement, the wholly pessimistic and satirical novel <i>Nineteen Eighty-Four</i>, which depicts the threat of political tyranny in the future.&rdquo; (paragraph 5)"}], "answer": "D", "why": "This is the only choice that connects a belief directly to a book: the ideological shift produced a novel about political tyranny."}, {"sec": "ela", "n": 38, "type": "mc", "text": "orwell", "grp": "orwell", "stem": "<p>Read this sentence from paragraph 5.</p><blockquote>Nevertheless, the ideological shift inspired his crowning literary achievement, the wholly pessimistic and satirical novel <i>Nineteen Eighty-Four</i>, which depicts the threat of political tyranny in the future.</blockquote><p>As used in the sentence, what does the word &ldquo;crowning&rdquo; most nearly mean?</p>", "choices": [{"l": "E", "h": "related to royalty"}, {"l": "F", "h": "last to be written"}, {"l": "G", "h": "greatest of all"}, {"l": "H", "h": "surprising to readers"}], "answer": "G", "why": "&ldquo;Crowning literary achievement&rdquo; names his finest work; the passage calls <i>Nineteen Eighty-Four</i> his greatest, not merely his last."}, {"sec": "ela", "n": 39, "type": "mc", "text": "orwell", "grp": "orwell", "stem": "<p>With which statement would the author of the passage most likely agree?</p>", "choices": [{"l": "A", "h": "Orwell&rsquo;s continued efforts in the face of difficulties contributed to his success."}, {"l": "B", "h": "Living in two different countries as a child made Orwell the distinguished author he became."}, {"l": "C", "h": "Publishing his first stories in his school magazine made Orwell&rsquo;s later literary career possible."}, {"l": "D", "h": "Because he changed his way of thinking so often, Orwell struggled to clearly express his ideas."}], "answer": "A", "why": "The title and the repeated pattern of struggle followed by achievement point to perseverance as the cause of his success."}, {"sec": "ela", "n": 40, "type": "mc", "text": "orwell", "grp": "orwell", "stem": "<p>How does the author&rsquo;s description of Orwell&rsquo;s changing political beliefs in paragraphs 3&ndash;5 contribute to a central idea of the passage?</p>", "choices": [{"l": "E", "h": "It illustrates how Orwell&rsquo;s direct experiences with conflicting political systems challenged his assumptions and ultimately shaped his most influential writing."}, {"l": "F", "h": "It demonstrates that Orwell&rsquo;s inability to remain committed to a single political ideology prevented him from achieving literary success until late in life."}, {"l": "G", "h": "It suggests that Orwell&rsquo;s growing distrust of political institutions emerged primarily from his desire to gain recognition as a writer."}, {"l": "H", "h": "It emphasizes that Orwell&rsquo;s literary achievements resulted from his willingness to abandon his personal convictions in response to changing circumstances."}], "answer": "E", "why": "Imperial service bred disenchantment with bureaucracy and Spain bred cynicism about communism &mdash; and both &ldquo;inspired&rdquo; his major books."}, {"sec": "ela", "n": 41, "type": "mc", "text": "college", "grp": "college", "stem": "<p>Which sentence should replace sentence 3 to best state the topic of the passage?</p>", "choices": [{"l": "A", "h": "Determining the most effective way to make college affordable is a complex issue, and there are differing opinions about how to approach the problem."}, {"l": "B", "h": "Several states have implemented scholarship programs that allow students to attend public universities and community colleges at a very low tuition rate or for free."}, {"l": "C", "h": "Higher-education institutions should reduce the cost of a college education by finding ways to help students avoid paying for unnecessary classes and materials."}, {"l": "D", "h": "The main concern related to the issue of college affordability is that helping students cover tuition could affect the quality of the education they receive."}], "answer": "A", "why": "The passage presents supporters, critics, and institutional measures, then calls the solutions &ldquo;not simple&rdquo; &mdash; a complex issue with differing opinions. The other choices each cover only one paragraph."}, {"sec": "ela", "n": 42, "type": "mc", "text": "college", "grp": "college", "stem": "<p>Read this sentence.</p><blockquote>Some note that several states have made their community or state colleges low-cost or free for students with limited resources.</blockquote><p>Where should the sentence be added to best support the ideas in the second paragraph (sentences 4&ndash;7)?</p>", "choices": [{"l": "E", "h": "at the beginning of the paragraph (before sentence 4)"}, {"l": "F", "h": "between sentences 4 and 5"}, {"l": "G", "h": "between sentences 5 and 6"}, {"l": "H", "h": "between sentences 6 and 7"}], "answer": "F", "why": "The new sentence is the general claim that the New York and Tennessee examples illustrate, so it belongs after the paragraph&rsquo;s topic sentence and before &ldquo;For example.&rdquo;"}, {"sec": "ela", "n": 43, "type": "mc", "text": "college", "grp": "college", "stem": "<p>Which sentence presents information that shifts away from the topic of the third paragraph (sentences 8&ndash;13) and should be deleted?</p>", "choices": [{"l": "A", "h": "sentence 10"}, {"l": "B", "h": "sentence 11"}, {"l": "C", "h": "sentence 12"}, {"l": "D", "h": "sentence 13"}], "answer": "B", "why": "The paragraph argues that state funding is unsustainable. Sentence 11&rsquo;s reasons students take longer &mdash; switching majors, having to work &mdash; are about individual circumstances, not program funding, and sentence 12&rsquo;s &ldquo;these circumstances&rdquo; still works without it."}, {"sec": "ela", "n": 44, "type": "mc", "text": "college", "grp": "college", "stem": "<p>Which phrase should be added before sentence 14 to best transition to the ideas in the fourth paragraph (sentences 14&ndash;17)?</p>", "choices": [{"l": "E", "h": "Because college affordability is a complicated issue,"}, {"l": "F", "h": "With so many opinions about how to make college affordable,"}, {"l": "G", "h": "Until college becomes more affordable,"}, {"l": "H", "h": "Although some college affordability programs have been successful,"}], "answer": "H", "why": "&ldquo;Although&rdquo; concedes the state programs just debated and pivots to a different approach &mdash; what institutions themselves can do."}, {"sec": "ela", "n": 45, "type": "mc", "text": "college", "grp": "college", "stem": "<p>Which concluding sentence should be added after sentence 19 to support the topic of the passage?</p>", "choices": [{"l": "A", "h": "The increasing use of technology in college classrooms and the financial support from tuition scholarship programs will make colleges more affordable for many students."}, {"l": "B", "h": "Statewide tuition scholarship programs will make college more affordable for many students, but these programs may lead to new problems."}, {"l": "C", "h": "Until the problems associated with the rising cost of college are solved, many students will pursue other options after graduating high school."}, {"l": "D", "h": "When the issue of college affordability is resolved, students will be able to make decisions about pursuing higher education without cost being the deciding factor."}], "answer": "D", "why": "The passage never picks a winner among the approaches, so the conclusion should point to what solving the problem would mean for students rather than endorse one solution."}, {"sec": "ela", "n": 46, "type": "mc", "text": null, "grp": null, "stem": "<p>Read this paragraph.</p><blockquote>(1) The Brooklyn Bridge has drawn visitors from around the world since it opened in 1883. (2) Spanning the East River with its distinctive stone towers, engineers completed the bridge after fourteen years of work. (3) Its designer, John Roebling, died before construction began, and his son Washington took over the project. (4) Today, the bridge carries thousands of pedestrians and cyclists across the river every day.</blockquote><p>Which sentence contains an error in its construction and should be revised?</p>", "choices": [{"l": "E", "h": "sentence 1"}, {"l": "F", "h": "sentence 2"}, {"l": "G", "h": "sentence 3"}, {"l": "H", "h": "sentence 4"}], "answer": "F", "why": "Sentence 2 has a dangling modifier: &ldquo;Spanning the East River with its distinctive stone towers&rdquo; describes the bridge, but the subject that follows is <i>engineers</i>."}, {"sec": "ela", "n": 47, "type": "mc", "text": null, "grp": null, "stem": "<p>Read this sentence.</p><blockquote>After the storm knocked out power to the neighborhood, the mayor made it known to everyone who lived in the area that help was on the way.</blockquote><p>Which revision uses the most precise language for the words &ldquo;made it known to everyone who lived in the area that help was on the way&rdquo;?</p>", "choices": [{"l": "A", "h": "told people things about the situation"}, {"l": "B", "h": "let the neighborhood know about the help"}, {"l": "C", "h": "assured residents that crews were coming"}, {"l": "D", "h": "communicated with everybody nearby"}], "answer": "C", "why": "&ldquo;Assured residents that crews were coming&rdquo; names both who was told and what they were told; the others replace vague wording with more vague wording."}, {"sec": "ela", "n": 48, "type": "mc", "text": null, "grp": null, "stem": "<p>Read this paragraph.</p><blockquote>The Harlem Renaissance began in the 1920s and reshaped American art and literature, the movement drew writers, musicians, and painters to a few square miles of upper Manhattan. Langston Hughes published his first poems during these years. Zora Neale Hurston collected folklore across the South and brought it into her fiction. The music of the period, including the work of Duke Ellington, still fills concert halls today.</blockquote><p>Which revision corrects the run-on sentence in the paragraph?</p>", "choices": [{"l": "E", "h": "literature, and the movement"}, {"l": "F", "h": "literature; drawing writers"}, {"l": "G", "h": "Hughes, publishing his"}, {"l": "H", "h": "period; including the work"}], "answer": "E", "why": "Two independent clauses are spliced with only a comma; adding the coordinating conjunction <i>and</i> joins them correctly."}, {"sec": "ela", "n": 49, "type": "mc", "text": null, "grp": null, "stem": "<p>Read this paragraph.</p><blockquote>(1) The city council met with the planning committee to discuss the proposed bike lane. (2) After two hours of debate, they voted to delay the decision until spring. (3) Several residents who had waited through the entire meeting left without speaking. (4) The council promised to publish a full summary of the discussion within a week.</blockquote><p>Which sentence contains an error in its construction and should be revised?</p>", "choices": [{"l": "A", "h": "sentence 1"}, {"l": "B", "h": "sentence 2"}, {"l": "C", "h": "sentence 3"}, {"l": "D", "h": "sentence 4"}], "answer": "B", "why": "In sentence 2 the pronoun <i>they</i> is ambiguous: it could refer to the city council or to the planning committee."}, {"sec": "ela", "n": 50, "type": "mc", "text": null, "grp": null, "stem": "<p>Read this paragraph.</p><blockquote>(1) The Metropolitan Museum of Art houses more than two million works of art spanning thousands of years. (2) A collection of ancient Egyptian artifacts, European paintings, and modern sculptures attract visitors from around the world. (3) In addition to its permanent collection, the museum hosts temporary exhibitions throughout the year. (4) Many visitors spend hours exploring the galleries and learning about the history behind the artwork.</blockquote><p>Which sentence contains a subject-verb agreement error and should be revised?</p>", "choices": [{"l": "E", "h": "sentence 1"}, {"l": "F", "h": "sentence 2"}, {"l": "G", "h": "sentence 3"}, {"l": "H", "h": "sentence 4"}], "answer": "F", "why": "The subject of sentence 2 is the singular <i>collection</i>, not the plural nouns in the prepositional phrase, so the verb should be <i>attracts</i>."}]}, {"key": "math", "label": "Mathematics", "blurb": "Fifty questions in ascending order of difficulty. Five are grid-in: type a numerical answer. Questions move forward only.", "items": [{"sec": "math", "n": 1, "type": "mc", "stem": "<div class='disp'>&#40;&minus;<span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">3</span></span>&#41;&#40;&minus;<span class=\"frac\"><span class=\"num\">9</span><span class=\"den\">10</span></span>&#41;</div><p>What is the value of the expression above?</p>", "answer": "B", "text": null, "grp": null, "choices": [{"l": "A", "h": "&minus;<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">5</span></span>"}, {"l": "B", "h": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">5</span></span>"}, {"l": "C", "h": "<span class=\"frac\"><span class=\"num\">11</span><span class=\"den\">15</span></span>"}, {"l": "D", "h": "<span class=\"frac\"><span class=\"num\">27</span><span class=\"den\">20</span></span>"}]}, {"sec": "math", "n": 2, "type": "mc", "stem": "<div class='disp'>18.63 &divide; 0.09 =</div>", "answer": "H", "text": null, "grp": null, "choices": [{"l": "E", "h": "0.207"}, {"l": "F", "h": "2.07"}, {"l": "G", "h": "20.7"}, {"l": "H", "h": "207"}]}, {"sec": "math", "n": 3, "type": "mc", "stem": "<p>What is the prime factorization of 540?</p>", "answer": "A", "text": null, "grp": null, "choices": [{"l": "A", "h": "2<sup>2</sup> &middot; 3<sup>3</sup> &middot; 5"}, {"l": "B", "h": "2<sup>2</sup> &middot; 3<sup>2</sup> &middot; 15"}, {"l": "C", "h": "2<sup>3</sup> &middot; 3<sup>3</sup> &middot; 5"}, {"l": "D", "h": "2 &middot; 3<sup>3</sup> &middot; 10"}]}, {"sec": "math", "n": 4, "type": "grid", "stem": "<p>The list shows the daily low temperatures in a town during six days in winter.</p><div class='disp'>5&deg; F,&nbsp; &minus;3&deg; F,&nbsp; 8&deg; F,&nbsp; 0&deg; F,&nbsp; &minus;7&deg; F,&nbsp; 2&deg; F</div><p>What is the difference between the lowest and highest temperatures, in degrees Fahrenheit, for the six days?</p>", "answer": "15", "text": null, "grp": null, "choices": []}, {"sec": "math", "n": 5, "type": "mc", "stem": "<p>A rain gauge shows that 45 centimeters of rain fell during a storm. If 1 inch is equal to approximately 2.5 centimeters, about how many inches of rain fell?</p>", "answer": "A", "text": null, "grp": null, "choices": [{"l": "A", "h": "18"}, {"l": "B", "h": "22.5"}, {"l": "C", "h": "47.5"}, {"l": "D", "h": "112.5"}]}, {"sec": "math", "n": 6, "type": "mc", "stem": "<p>Marisol wants to put a ribbon around the edge of a circular tray with a radius of 8 inches. What is the distance, in inches, around the edge of the tray? Use 3.14 for &pi;.</p>", "answer": "F", "text": null, "grp": null, "choices": [{"l": "E", "h": "25.12"}, {"l": "F", "h": "50.24"}, {"l": "G", "h": "100.48"}, {"l": "H", "h": "200.96"}]}, {"sec": "math", "n": 7, "type": "mc", "stem": "<p><div class='tbl-title'>COST OF NOTEBOOKS</div><table class='data'><tr><th>Number of Notebooks</th><th>Cost</th></tr><tr><td>3</td><td>$4.35</td></tr><tr><td>5</td><td>$7.25</td></tr><tr><td>8</td><td>$11.60</td></tr></table></p><p>The table shows the cost of notebooks. What is the unit rate for the cost per notebook?</p>", "answer": "D", "text": null, "grp": null, "choices": [{"l": "A", "h": "$0.58"}, {"l": "B", "h": "$0.87"}, {"l": "C", "h": "$1.16"}, {"l": "D", "h": "$1.45"}]}, {"sec": "math", "n": 8, "type": "mc", "stem": "<p>Devin earns $15 per hour at his job. He is offered a new job that will pay $18 per hour. What will be the percent increase in Devin&rsquo;s hourly pay if he takes the new job?</p>", "answer": "E", "text": null, "grp": null, "choices": [{"l": "E", "h": "20%"}, {"l": "F", "h": "25%"}, {"l": "G", "h": "83%"}, {"l": "H", "h": "120%"}]}, {"sec": "math", "n": 9, "type": "mc", "stem": "<p>The height of a seedling, in millimeters, is proportional to the number of days the seedling has grown. The seedling has grown 36 millimeters in 9 days. What is the constant of proportionality, in millimeters per day?</p>", "answer": "D", "text": null, "grp": null, "choices": [{"l": "A", "h": "0.25"}, {"l": "B", "h": "0.4"}, {"l": "C", "h": "3.6"}, {"l": "D", "h": "4"}]}, {"sec": "math", "n": 10, "type": "mc", "stem": "<p>Which table shows a proportional relationship?</p><div class='tblrow'><div><b>Table 1</b><table class='data'><tr><th><i>x</i></th><th><i>y</i></th></tr><tr><td>0</td><td>1</td></tr><tr><td>3</td><td>7</td></tr><tr><td>6</td><td>13</td></tr></table></div><div><b>Table 2</b><table class='data'><tr><th><i>x</i></th><th><i>y</i></th></tr><tr> r 12-inch rulers. If she lays all three yardsticks and all four rulers end-to-end, what is the maximum length, in feet, she can measure accurately at once?</p>", "answer": "D", "text": null, "grp": null, "choices": [{"l": "A", "h": "7 ft"}, {"l": "B", "h": "10 ft"}, {"l": "C", "h": "11 ft"}, {"l": "D", "h": "13 ft"}]}, {"sec": "math", "n": 30, "type": "mc", "stem": "<p>A coach bought bottles of water for her team. The total number of bottles she bought, <i>b</i>, is proportional to <i>n</i>, the number of players at practice. Which equation represents the relationship between <i>b</i> and <i>n</i>? The constant of proportionality is <i>k</i>.</p>", "answer": "F", "text": null, "grp": null, "choices": [{"l": "E", "h": "<i>b</i> = <i>k</i> + <i>n</i>"}, {"l": "F", "h": "<i>b</i> = <i>kn</i>"}, {"l": "G", "h": "<i>b</i> + <i>n</i> = <i>k</i>"}, {"l": "H", "h": "<i>b</i> + <i>n</i> + <i>k</i> = 1"}]}, {"sec": "math", "n": 31, "type": "grid", "stem": "<p>The box plot shows the average monthly high temperatures in a city for 12 months.</p><div class=\"fig\"><svg viewBox=\"0 0 520 238\" width=\"520\" height=\"238\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Georgia,serif\" font-size=\"15\" fill=\"#1a2433\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"160.8\" y=\"78\" width=\"156.8\" height=\"60\" fill=\"#eef2f7\" stroke=\"#1a2433\" stroke-width=\"1.8\"/><line x1=\"239.2\" y1=\"78\" x2=\"239.2\" y2=\"138\" stroke=\"#1a2433\" stroke-width=\"2.4\"/><line x1=\"82.4\" y1=\"108\" x2=\"160.8\" y2=\"108\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><line x1=\"317.6\" y1=\"108\" x2=\"452\" y2=\"108\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><line x1=\"82.4\" y1=\"87\" x2=\"82.4\" y2=\"129\" stroke=\"#1a2433\" stroke-width=\"2\"/><line x1=\"452\" y1=\"87\" x2=\"452\" y2=\"129\" stroke=\"#1a2433\" stroke-width=\"2\"/><line x1=\"46\" y1=\"172\" x2=\"494\" y2=\"172\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><line x1=\"60\" y1=\"172\" x2=\"60\" y2=\"179\" stroke=\"#
