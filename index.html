e-width=\"1.4\" stroke-dasharray=\"5 4\"/><path d=\"M 118 162 h 12 v -12\" fill=\"none\" stroke=\"#1a2433\" stroke-width=\"1.3\"/><text x=\"42\" y=\"168\" text-anchor=\"middle\" font-size=\"14\" font-style=\"italic\">P</text><text x=\"114\" y=\"36\" text-anchor=\"middle\" font-size=\"14\" font-style=\"italic\">Q</text><text x=\"342\" y=\"38\" text-anchor=\"middle\" font-size=\"14\" font-style=\"italic\">R</text><text x=\"280\" y=\"172\" text-anchor=\"middle\" font-size=\"14\" font-style=\"italic\">S</text><text x=\"120\" y=\"182\" text-anchor=\"middle\" font-size=\"14\" font-style=\"italic\">T</text><text x=\"140\" y=\"110\" text-anchor=\"middle\" font-size=\"14\" >14 cm</text><line x1=\"56\" y1=\"186\" x2=\"268\" y2=\"186\" stroke=\"#1a2433\" stroke-width=\"1.2\"/><text x=\"162\" y=\"204\" text-anchor=\"middle\" font-size=\"14\" >26 cm</text></svg></div><p>On parallelogram <i>PQRS</i> above, the length of <span class='ovl'>QT</span> is 14 centimeters. What is the area of the parallelogram?</p>", "answer": "G", "text": null, "grp": null, "choices": [{"l": "E", "h": "80 sq cm"}, {"l": "F", "h": "182 sq cm"}, {"l": "G", "h": "364 sq cm"}, {"l": "H", "h": "728 sq cm"}]}, {"sec": "math", "n": 33, "type": "mc", "stem": "<p>Allison has 7 crates with 384 apples in each crate. If she repacks her apples into 9 crates, each holding 296 apples, how many apples will be left over?</p>", "answer": "A", "text": null, "grp": null, "choices": [{"l": "A", "h": "24"}, {"l": "B", "h": "88"}, {"l": "C", "h": "264"}, {"l": "D", "h": "2,664"}]}, {"sec": "math", "n": 34, "type": "mc", "stem": "<p>Start with the number 87.46 and perform the following steps in order:</p><ul><li>Step 1: Multiply by 10.</li><li>Step 2: Add 0.5 to the result of Step 1.</li><li>Step 3: Drop the digits after the decimal point.</li><li>Step 4: Divide by 10.</li></ul><p>What is the result?</p>", "answer": "H", "text": null, "grp": null, "choices": [{"l": "E", "h": "8.75"}, {"l": "F", "h": "87.4"}, {"l": "G", "h": "87.46"}, {"l": "H", "h": "87.5"}]}, {"sec": "math", "n": 35, "type": "mc", "stem": "<p>In a showing of an artist&rsquo;s works, the ratio of the number of sketches, paintings, and prints shown is 2:6:5, respectively. If the number of paintings shown was 54, what is the total number of sketches and prints that were shown?</p>", "answer": "C", "text": null, "grp": null, "choices": [{"l": "A", "h": "45"}, {"l": "B", "h": "54"}, {"l": "C", "h": "63"}, {"l": "D", "h": "117"}]}, {"sec": "math", "n": 36, "type": "mc", "stem": "<p>The table shows the probability of randomly drawing each color of marble from a bag.</p><div class='tbl-title'>DRAWING A MARBLE FROM A BAG</div><table class='data'><tr><th>Color</th><th>Probability</th></tr><tr><td>Amber</td><td>0.185</td></tr><tr><td>Cobalt</td><td>0.42</td></tr><tr><td>Jade</td><td>0.3</td></tr><tr><td>Rose</td><td>0.095</td></tr></table><p>Which color is most likely to be randomly drawn?</p>", "answer": "F", "text": null, "grp": null, "choices": [{"l": "E", "h": "amber"}, {"l": "F", "h": "cobalt"}, {"l": "G", "h": "jade"}, {"l": "H", "h": "rose"}]}, {"sec": "math", "n": 37, "type": "mc", "stem": "<p>A bag contains 20 marbles: 16 blue marbles and 4 green marbles. Sarah picks one marble randomly, returns it to the bag, and then randomly picks one marble again. What is the probability that she picks a green marble <b>both</b> times?</p>", "answer": "A", "text": null, "grp": null, "choices": [{"l": "A", "h": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">25</span></span>"}, {"l": "B", "h": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">5</span></span>"}, {"l": "C", "h": "<span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">5</span></span>"}, {"l": "D", "h": "<span class=\"frac\"><span class=\"num\">16</span><span class=\"den\">25</span></span>"}]}, {"sec": "math", "n": 38, "type": "mc", "stem": "<p><div class='tbl-title'>LAST YEAR&rsquo;S TOTAL ATTENDANCE</div><table class='data'><tr><th>Attendees</th><th>Number</th></tr><tr><td>Children</td><td>1,800</td></tr><tr><td>Adults</td><td>2,400</td></tr><tr><td>Seniors</td><td>1,800</td></tr><tr><td><b>Total</b></td><td><b>6,000</b></td></tr></table></p><p>If 150 individuals will attend the museum next week, what is the best estimate (based on last year&rsquo;s attendance) of the number of adults who will be in that group?</p>", "answer": "G", "text": null, "grp": null, "choices": [{"l": "E", "h": "45"}, {"l": "F", "h": "50"}, {"l": "G", "h": "60"}, {"l": "H", "h": "75"}]}, {"sec": "math", "n": 39, "type": "mc", "stem": "<p>A shipment contains 250 small boxes of medical supplies. In a random sample of 25 of these boxes, 6 have damage and the others are undamaged. Based on this sample, what is the best prediction of the number of undamaged boxes in the shipment, <b>not</b> including the boxes in the random sample?</p>", "answer": "B", "text": null, "grp": null, "choices": [{"l": "A", "h": "60"}, {"l": "B", "h": "171"}, {"l": "C", "h": "180"}, {"l": "D", "h": "190"}]}, {"sec": "math", "n": 40, "type": "mc", "stem": "<div class=\"fig\"><svg viewBox=\"0 0 470 250\" width=\"470\" height=\"250\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Georgia,serif\" font-size=\"15\" fill=\"#1a2433\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"40\" y1=\"72\" x2=\"420\" y2=\"72\" stroke=\"#1a2433\" stroke-width=\"1.8\"/><line x1=\"40\" y1=\"198\" x2=\"420\" y2=\"198\" stroke=\"#1a2433\" stroke-width=\"1.8\"/><line x1=\"142.878\" y1=\"17.2427\" x2=\"225.122\" y2=\"252.757\" stroke=\"#1a2433\" stroke-width=\"1.8\"/><circle cx=\"162\" cy=\"72\" r=\"3.6\" fill=\"#1a2433\"/><circle cx=\"206\" cy=\"198\" r=\"3.6\" fill=\"#1a2433\"/><text x=\"432\" y=\"77\" text-anchor=\"start\" font-size=\"15\" ><tspan font-style='italic'>n</tspan></text><text x=\"432\" y=\"203\" text-anchor=\"start\" font-size=\"15\" ><tspan font-style='italic'>p</tspan></text><text x=\"248\" y=\"40\" text-anchor=\"start\" font-size=\"15\" ><tspan font-style='italic'>m</tspan></text><line x1=\"90\" y1=\"66\" x2=\"98\" y2=\"72\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><line x1=\"98\" y1=\"72\" x2=\"90\" y2=\"78\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><line x1=\"90\" y1=\"192\" x2=\"98\" y2=\"198\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><line x1=\"98\" y1=\"198\" x2=\"90\" y2=\"204\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><path d=\"M 172.55 102.211 A 32 32 0 0 0 194 72\" fill=\"none\" stroke=\"#1a2433\" stroke-width=\"1.4\"/><text x=\"246\" y=\"102\" text-anchor=\"middle\" font-size=\"15\" >68&deg;</text><path d=\"M 238 198 A 32 32 0 0 0 195.45 167.789\" fill=\"none\" stroke=\"#1a2433\" stroke-width=\"1.4\"/><text x=\"247.894\" y=\"152.447\" text-anchor=\"middle\" font-size=\"16\" ><tspan font-style='italic'>r</tspan>&deg;</text></svg></div><p>In the figure above, <i>n</i> &#8741; <i>p</i>. Straight line <i>m</i> intersects both line <i>n</i> and line <i>p</i>. What is the value of <i>r</i>?</p>", "answer": "G", "text": null, "grp": null, "choices": [{"l": "E", "h": "22"}, {"l": "F", "h": "68"}, {"l": "G", "h": "112"}, {"l": "H", "h": "158"}]}, {"sec": "math", "n": 41, "type": "mc", "stem": "<p>If 7&#40;<i>x</i> &minus; 4<i>y</i>&#41; = 35<i>y</i>, what is the value of <i>x</i> in terms of <i>y</i>?</p>", "answer": "B", "text": null, "grp": null, "choices": [{"l": "A", "h": "5<i>y</i>"}, {"l": "B", "h": "9<i>y</i>"}, {"l": "C", "h": "11<i>y</i>"}, {"l": "D", "h": "39<i>y</i>"}]}, {"sec": "math", "n": 42, "type": "mc", "stem": "<p>The circle graph shows how a family&rsquo;s monthly budget is divided.</p><div class=\"fig\"><svg viewBox=\"-40 0 460 376\" width=\"380\" height=\"376\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Georgia,serif\" font-size=\"15\" fill=\"#1a2433\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"182\" cy=\"186\" r=\"104\" fill=\"#fff\" stroke=\"#1a2433\" stroke-width=\"1.8\"/><line x1=\"182\" y1=\"186\" x2=\"182\" y2=\"82\" stroke=\"#1a2433\" stroke-width=\"1.5\"/><line x1=\"182\" y1=\"186\" x2=\"269.81\" y2=\"241.726\" stroke=\"#1a2433\" stroke-width=\"1.5\"/><line x1=\"182\" y1=\"186\" x2=\"269.81\" y2=\"241.726\" stroke=\"#1a2433\" stroke-width=\"1.5\"/><line x1=\"182\" y1=\"186\" x2=\"143.715\" y2=\"282.697\" stroke=\"#1a2433\" stroke-width=\"1.5\"/><line x1=\"182\" y1=\"186\" x2=\"143.715\" y2=\"282.697\" stroke=\"#1a2433\" stroke-width=\"1.5\"/><line x1=\"182\" y1=\"186\" x2=\"87.898\" y2=\"230.281\" stroke=\"#1a2433\" stroke-width=\"1.5\"/><line x1=\"182\" y1=\"186\" x2=\"87.898\" y2=\"230.281\" stroke=\"#1a2433\" stroke-width=\"1.5\"/><line x1=\"182\" y1=\"186\" x2=\"78.8201\" y2=\"172.965\" stroke=\"#1a2433\" stroke-width=\"1.5\"/><line x1=\"182\" y1=\"186\" x2=\"78.8201\" y2=\"172.965\" stroke=\"#1a2433\" stroke-width=\"1.5\"/><line x1=\"182\" y1=\"186\" x2=\"97.8622\" y2=\"124.87\" stroke=\"#1a2433\" stroke-width=\"1.5\"/><line x1=\"182\" y1=\"186\" x2=\"97.8622\" y2=\"124.87\" stroke=\"#1a2433\" stroke-width=\"1.5\"/><line x1=\"182\" y1=\"186\" x2=\"182\" y2=\"82\" stroke=\"#1a2433\" stroke-width=\"1.5\"/><line x1=\"276.641\" y1=\"133.971\" x2=\"292.415\" y2=\"125.299\" stroke=\"#1a2433\" stroke-width=\"1.1\"/><text x=\"304.425\" y=\"125.445\" text-anchor=\"start\" font-size=\"12.5\" >Rent 34%</text><line x1=\"215.374\" y1=\"288.714\" x2=\"220.936\" y2=\"305.833\" stroke=\"#1a2433\" stroke-width=\"1.1\"/><text x=\"228.408\" y=\"317.442\" text-anchor=\"start\" font-size=\"12.5\" >Food 22%</text><line x1=\"108.069\" y1=\"264.729\" x2=\"95.7471\" y2=\"277.85\" stroke=\"#1a2433\" stroke-width=\"1.1\"/><text x=\"85.2707\" y=\"287.682\" text-anchor=\"end\" font-size=\"12.5\" >Transit 12%</text><line x1=\"75.3297\" y1=\"202.895\" x2=\"57.5513\" y2=\"205.711\" stroke=\"#1a2433\" stroke-width=\"1.1\"/><text x=\"44.6498\" y=\"210.962\" text-anchor=\"end\" font-size=\"12.5\" >Savings 9%</text><line x1=\"81.5841\" y1=\"146.243\" x2=\"64.8482\" y2=\"139.616\" stroke=\"#1a2433\" stroke-width=\"1.1\"/><text x=\"52.41\" y=\"140.671\" text-anchor=\"end\" font-size=\"12.5\" >Other 8%</text><line x1=\"132.969\" y1=\"89.7713\" x2=\"124.797\" y2=\"73.7332\" stroke=\"#1a2433\" stroke-width=\"1.1\"/><text x=\"116.165\" y=\"70.6051\" text-anchor=\"end\" font-size=\"12.5\" >Utilities x%</text><text x=\"182\" y=\"358\" text-anchor=\"middle\" font-size=\"13\" >Total monthly budget = $3,200</text></svg></div><p>Based on the circle graph, how much of the family&rsquo;s monthly budget is spent on utilities?</p>", "answer": "H", "text": null, "grp": null, "choices": [{"l": "E", "h": "$288"}, {"l": "F", "h": "$384"}, {"l": "G", "h": "$432"}, {"l": "H", "h": "$480"}]}, {"sec": "math", "n": 43, "type": "grid", "stem": "<p>The figure below shows a circle with a hole in the middle. The outer diameter of the circle is 2&frac12; inches. The diameter of the hole is &frac12; inch.</p><div class=\"fig\"><svg viewBox=\"0 0 360 340\" width=\"360\" height=\"340\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Georgia,serif\" font-size=\"15\" fill=\"#1a2433\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"180\" cy=\"170\" r=\"118\" fill=\"#d7dee7\" stroke=\"#1a2433\" stroke-width=\"1.8\"/><circle cx=\"180\" cy=\"170\" r=\"32\" fill=\"#ffffff\" stroke=\"#1a2433\" stroke-width=\"1.8\"/><line x1=\"148\" y1=\"170\" x2=\"212\" y2=\"170\" stroke=\"#1a2433\" stroke-width=\"1.2\"/><path d=\"M 148 170 l 6 -4 v 8 z\" fill=\"#1a2433\"/><path d=\"M 212 170 l -6 -4 v 8 z\" fill=\"#1a2433\"/><text x=\"180\" y=\"160\" text-anchor=\"middle\" font-size=\"13\" ><tspan font-size='13'>&frac12; in.</tspan></text><line x1=\"62\" y1=\"322\" x2=\"298\" y2=\"322\" stroke=\"#1a2433\" stroke-width=\"1.3\"/><path d=\"M 62 322 l 8 -5 v 10 z\" fill=\"#1a2433\"/><path d=\"M 298 322 l -8 -5 v 10 z\" fill=\"#1a2433\"/><rect x=\"153\" y=\"313\" width=\"54\" height=\"18\" fill=\"#fff\"/><text x=\"180\" y=\"327\" text-anchor=\"middle\" font-size=\"14\" >2&frac12; in.</text></svg></div><p>What is the area of the shaded region, to the nearest hundredth of a square inch?</p>", "answer": "4.71", "text": null, "grp": null, "choices": []}, {"sec": "math", "n": 44, "type": "mc", "stem": "<p><table class='data'><tr><th>Report</th><th>Subject</th><th>Topic Choices</th></tr><tr><td>#1</td><td>History</td><td>Rome, Egypt, Mali</td></tr><tr><td>#2</td><td>English</td><td>Hughes, Giovanni</td></tr><tr><td>#3</td><td>Science</td><td>the 1997 Mars mission</td></tr><tr><td>#4</td><td>Art</td><td>mosaics, murals, pottery, weaving</td></tr></table></p><p>Anita is assigned to report on 1 topic in each of the 4 subjects shown in the table above. How many different sets of 4 reports are possible, according to the choices available to her?</p>", "answer": "G", "text": null, "grp": null, "choices": [{"l": "E", "h": "10"}, {"l": "F", "h": "12"}, {"l": "G", "h": "24"}, {"l": "H", "h": "36"}]}, {"sec": "math", "n": 45, "type": "mc", "stem": "<p>A coin is flipped 3 times. This tree diagram shows the possible outcomes.</p><div class=\"fig\"><svg viewBox=\"0 0 320 290\" width=\"320\" height=\"290\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Georgia,serif\" font-size=\"15\" fill=\"#1a2433\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"36\" cy=\"128\" r=\"3\" fill=\"#1a2433\"/><line x1=\"40\" y1=\"128\" x2=\"87\" y2=\"82\" stroke=\"#1a2433\" stroke-width=\"1.2\"/><path d=\"M 92 82 l -6 -3 v 6 z\" fill=\"#1a2433\"/><rect x=\"92\" y=\"72\" width=\"26\" height=\"20\" fill=\"#fff\" stroke=\"#1a2433\" stroke-width=\"1.3\"/><text x=\"105\" y=\"86\" text-anchor=\"middle\" font-size=\"12.5\" >H</text><line x1=\"40\" y1=\"128\" x2=\"87\" y2=\"194\" stroke=\"#1a2433\" stroke-width=\"1.2\"/><path d=\"M 92 194 l -6 -3 v 6 z\" fill=\"#1a2433\"/><rect x=\"92\" y=\"184\" width=\"26\" height=\"20\" fill=\"#fff\" stroke=\"#1a2433\" stroke-width=\"1.3\"/><text x=\"105\" y=\"198\" text-anchor=\"middle\" font-size=\"12.5\" >T</text><line x1=\"118\" y1=\"82\" x2=\"171\" y2=\"54\" stroke=\"#1a2433\" stroke-width=\"1.2\"/><path d=\"M 176 54 l -6 -3 v 6 z\" fill=\"#1a2433\"/><rect x=\"176\" y=\"44\" width=\"26\" height=\"20\" fill=\"#fff\" stroke=\"#1a2433\" stroke-width=\"1.3\"/><text x=\"189\" y=\"58\" text-anchor=\"middle\" font-size=\"12.5\" >H</text><line x1=\"202\" y1=\"54\" x2=\"255\" y2=\"40\" stroke=\"#1a2433\" stroke-width=\"1.2\"/><path d=\"M 260 40 l -6 -3 v 6 z\" fill=\"#1a2433\"/><rect x=\"260\" y=\"30\" width=\"26\" height=\"20\" fill=\"#fff\" stroke=\"#1a2433\" stroke-width=\"1.3\"/><text x=\"273\" y=\"44\" text-anchor=\"middle\" font-size=\"12.5\" >H</text><line x1=\"202\" y1=\"54\" x2=\"255\" y2=\"68\" stroke=\"#1a2433\" stroke-width=\"1.2\"/><path d=\"M 260 68 l -6 -3 v 6 z\" fill=\"#1a2433\"/><rect x=\"260\" y=\"58\" width=\"26\" height=\"20\" fill=\"#fff\" stroke=\"#1a2433\" stroke-width=\"1.3\"/><text x=\"273\" y=\"72\" text-anchor=\"middle\" font-size=\"12.5\" >T</text><line x1=\"118\" y1=\"82\" x2=\"171\" y2=\"110\" stroke=\"#1a2433\" stroke-width=\"1.2\"/><path d=\"M 176 110 l -6 -3 v 6 z\" fill=\"#1a2433\"/><rect x=\"176\" y=\"100\" width=\"26\" height=\"20\" fill=\"#fff\" stroke=\"#1a2433\" stroke-width=\"1.3\"/><text x=\"189\" y=\"114\" text-anchor=\"middle\" font-size=\"12.5\" >T</text><line x1=\"202\" y1=\"110\" x2=\"255\" y2=\"96\" stroke=\"#1a2433\" stroke-width=\"1.2\"/><path d=\"M 260 96 l -6 -3 v 6 z\" fill=\"#1a2433\"/><rect x=\"260\" y=\"86\" width=\"26\" height=\"20\" fill=\"#fff\" stroke=\"#1a2433\" stroke-width=\"1.3\"/><text x=\"273\" y=\"100\" text-anchor=\"middle\" font-size=\"12.5\" >H</text><line x1=\"202\" y1=\"110\" x2=\"255\" y2=\"124\" stroke=\"#1a2433\" stroke-width=\"1.2\"/><path d=\"M 260 124 l -6 -3 v 6 z\" fill=\"#1a2433\"/><rect x=\"260\" y=\"114\" width=\"26\" height=\"20\" fill=\"#fff\" stroke=\"#1a2433\" stroke-width=\"1.3\"/><text x=\"273\" y=\"128\" text-anchor=\"middle\" font-size=\"12.5\" >T</text><line x1=\"118\" y1=\"194\" x2=\"171\" y2=\"166\" stroke=\"#1a2433\" stroke-width=\"1.2\"/><path d=\"M 176 166 l -6 -3 v 6 z\" fill=\"#1a2433\"/><rect x=\"176\" y=\"156\" width=\"26\" height=\"20\" fill=\"#fff\" stroke=\"#1a2433\" stroke-width=\"1.3\"/><text x=\"189\" y=\"170\" text-anchor=\"middle\" font-size=\"12.5\" >H</text><line x1=\"202\" y1=\"166\" x2=\"255\" y2=\"152\" stroke=\"#1a2433\" stroke-width=\"1.2\"/><path d=\"M 260 152 l -6 -3 v 6 z\" fill=\"#1a2433\"/><rect x=\"260\" y=\"142\" width=\"26\" height=\"20\" fill=\"#fff\" stroke=\"#1a2433\" stroke-width=\"1.3\"/><text x=\"273\" y=\"156\" text-anchor=\"middle\" font-size=\"12.5\" >H</text><line x1=\"202\" y1=\"166\" x2=\"255\" y2=\"180\" stroke=\"#1a2433\" stroke-width=\"1.2\"/><path d=\"M 260 180 l -6 -3 v 6 z\" fill=\"#1a2433\"/><rect x=\"260\" y=\"170\" width=\"26\" height=\"20\" fill=\"#fff\" stroke=\"#1a2433\" stroke-width=\"1.3\"/><text x=\"273\" y=\"184\" text-anchor=\"middle\" font-size=\"12.5\" >T</text><line x1=\"118\" y1=\"194\" x2=\"171\" y2=\"222\" stroke=\"#1a2433\" stroke-width=\"1.2\"/><path d=\"M 176 222 l -6 -3 v 6 z\" fill=\"#1a2433\"/><rect x=\"176\" y=\"212\" width=\"26\" height=\"20\" fill=\"#fff\" stroke=\"#1a2433\" stroke-width=\"1.3\"/><text x=\"189\" y=\"226\" text-anchor=\"middle\" font-size=\"12.5\" >T</text><line x1=\"202\" y1=\"222\" x2=\"255\" y2=\"208\" stroke=\"#1a2433\" stroke-width=\"1.2\"/><path d=\"M 260 208 l -6 -3 v 6 z\" fill=\"#1a2433\"/><rect x=\"260\" y=\"198\" width=\"26\" height=\"20\" fill=\"#fff\" stroke=\"#1a2433\" stroke-width=\"1.3\"/><text x=\"273\" y=\"212\" text-anchor=\"middle\" font-size=\"12.5\" >H</text><line x1=\"202\" y1=\"222\" x2=\"255\" y2=\"236\" stroke=\"#1a2433\" stroke-width=\"1.2\"/><path d=\"M 260 236 l -6 -3 v 6 z\" fill=\"#1a2433\"/><rect x=\"260\" y=\"226\" width=\"26\" height=\"20\" fill=\"#fff\" stroke=\"#1a2433\" stroke-width=\"1.3\"/><text x=\"273\" y=\"240\" text-anchor=\"middle\" font-size=\"12.5\" >T</text></svg></div><p>What is the probability that exactly 2 of the 3 flips land on heads?</p>", "answer": "C", "text": null, "grp": null, "choices": [{"l": "A", "h": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">8</span></span>"}, {"l": "B", "h": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">4</span></span>"}, {"l": "C", "h": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">8</span></span>"}, {"l": "D", "h": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>"}]}, {"sec": "math", "n": 46, "type": "mc", "stem": "<p>In basketball, a player earns 1 point for making a free throw and 2 points for making another kind of basket. Nia makes a mean of 6 free throws per game, and she scores a total of at least 30 points per game. The inequality below shows this relationship, where <i>b</i> represents the number of 2-point baskets Nia makes.</p><div class='disp'>2<i>b</i> + 6 &ge; 30</div><p>What is the number of 2-point baskets Nia needs to make if she wants to score at least her minimum total points for a game and make her mean number of free throws?</p>", "answer": "F", "text": null, "grp": null, "choices": [{"l": "E", "h": "<i>b</i> &le; 12"}, {"l": "F", "h": "<i>b</i> &ge; 12"}, {"l": "G", "h": "<i>b</i> &ge; 18"}, {"l": "H", "h": "<i>b</i> &le; 30"}]}, {"sec": "math", "n": 47, "type": "mc", "stem": "<p>This formula can be used to determine <i>p</i>, the number of pages in a book that contains <i>w</i> words, with an average of <i>r</i> words per page, and <i>f</i> extra pages in the front for the title and publishing information.</p><div class='disp'><i>p</i> = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\"><i>r</i></span></span><i>w</i> + <i>f</i></div><p>If the formula is solved for <i>w</i>, what will the formula be?</p>", "answer": "A", "text": null, "grp": null, "choices": [{"l": "A", "h": "<i>w</i> = <i>r</i>&#40;<i>p</i> &minus; <i>f</i>&#41;"}, {"l": "B", "h": "<i>w</i> = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\"><i>r</i></span></span><i>p</i> + <i>f</i>"}, {"l": "C", "h": "<i>w</i> = <i>f</i> + <i>rp</i>"}, {"l": "D", "h": "<i>w</i> = <i>r</i> + <i>p</i> + <i>f</i>"}]}, {"sec": "math", "n": 48, "type": "mc", "stem": "<p>A scale drawing of a new patio is shown below. All the corners are right angles.</p><div class=\"fig\"><svg viewBox=\"0 0 380 300\" width=\"380\" height=\"300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Georgia,serif\" font-size=\"15\" fill=\"#1a2433\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"70,50 290,50 290,242.5 207.5,242.5 207.5,160 70,160\" fill=\"#eef2f7\" stroke=\"#1a2433\" stroke-width=\"1.8\"/><text x=\"180\" y=\"40\" text-anchor=\"middle\" font-size=\"13\" >8 in.</text><text x=\"60\" y=\"110\" text-anchor=\"end\" font-size=\"13\" >4 in.</text><text x=\"138.75\" y=\"178\" text-anchor=\"middle\" font-size=\"13\" >5 in.</text><text x=\"300\" y=\"151.25\" text-anchor=\"start\" font-size=\"13\" >7 in.</text><text x=\"180\" y=\"276.5\" text-anchor=\"middle\" font-size=\"13.5\" >Scale:  1 in. = 12 ft</text></svg></div><p>What is the perimeter of the actual patio?</p>", "answer": "G", "text": null, "grp": null, "choices": [{"l": "E", "h": "240 ft"}, {"l": "F", "h": "288 ft"}, {"l": "G", "h": "360 ft"}, {"l": "H", "h": "420 ft"}]}, {"sec": "math", "n": 49, "type": "mc", "stem": "<p>A deck of 40 cards contains 10 stars. Sara has 8 cards from this deck in her hand, 2 of which are stars. The other cards remain in the deck. What is the probability that a card drawn at random from the remainder of the deck will be a star?</p>", "answer": "B", "text": null, "grp": null, "choices": [{"l": "A", "h": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">5</span></span>"}, {"l": "B", "h": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">4</span></span>"}, {"l": "C", "h": "<span class=\"frac\"><span class=\"num\">4</span><span class=\"den\">15</span></span>"}, {"l": "D", "h": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">3</span></span>"}]}, {"sec": "math", "n": 50, "type": "mc", "stem": "<p>A shuttle begins its route with <i>R</i> passengers (including the driver). At each of the 16 stops, 4 people get on and no one gets off. If there are 3 times as many passengers at the end of the 16th stop as there are at the end of the 4th stop, how many passengers did the shuttle have immediately after the 8th stop?</p>", "answer": "H", "text": null, "grp": null, "choices": [{"l": "E", "h": "16"}, {"l": "F", "h": "24"}, {"l": "G", "h": "32"}, {"l": "H", "h": "40"}]}]}], "texts": {"wells": {"label": "Tales of Space and Time", "html": "<h3 class=\"ptitle\">Excerpt from <i>Tales of Space and Time</i></h3><div class=\"byline\">by H. G. Wells</div><p class=\"pintro\">In this excerpt, astronomers in the year 1900 have observed a strange, bright star which, according to the calculations of a master mathematician, seems to be headed for a collision, or close fly-by with earth, causing a catastrophe. With scholarly detachment, the mathematician, who is also a teacher, explains his findings to his students.</p><p class=\"ppara\"><span class=\"pnum\">1</span><span>The master mathematician sat in his private room and pushed the papers from him. His calculations were already finished. In a small white phial there still remained a little of the drug that had kept him awake and active for four long nights. Each day, serene, explicit, patient as ever, he had given his lecture to his students, and then had come back at once to this momentous calculation. His face was grave, a little drawn and hectic from his drugged activity. For some time he seemed lost in thought. Then he went to the window, and the blind went up with a click. Halfway up the sky, over the clustering roofs, chimneys and steeples of the city, hung the star.</span></p><p class=\"ppara\"><span class=\"pnum\">2</span><span>He looked at the little phial. &ldquo;There will be no need of sleep again,&rdquo; he said. The next day at noon&mdash;punctual to the minute, he entered his lecture theatre, put his hat on the end of the table as his habit was, and carefully selected a large piece of chalk. It was a joke among his students that he could not lecture without that piece of chalk to fumble in his fingers, and once he had been stricken to impotence by their hiding his supply. He came and looked under his grey eyebrows at the rising tiers of young fresh faces, and spoke with his accustomed studied commonness of phrasing. &ldquo;Circumstances have arisen&mdash;circumstances beyond my control,&rdquo; he said and paused, &ldquo;which will debar me from completing the course I had designed. It would seem, gentlemen, if I may put the thing clearly and briefly, that&mdash;Man has lived in vain.&rdquo;</span></p><p class=\"ppara\"><span class=\"pnum\">3</span><span>The students glanced at one another. Had they heard aright? Mad? Raised eyebrows and grinning lips there were, but one or two faces remained intent upon his calm grey-fringed face. &ldquo;It will be interesting,&rdquo; he was saying, &ldquo;to devote this morning to an exposition, so far as I can make it clear to you, of the calculations that have led me to this conclusion. Let us assume&mdash;&rdquo;</span></p><p class=\"ppara\"><span class=\"pnum\">4</span><span>He turned towards the blackboard, meditating a diagram in the way that was usual to him. &ldquo;What was that about &lsquo;lived in vain?&rsquo;&rdquo; whispered one student to another. &ldquo;Listen,&rdquo; said the other, nodding towards the lecturer.</span></p><p class=\"ppara\"><span class=\"pnum\">5</span><span>And presently they began to understand.</span></p><p class=\"ppara\"><span class=\"pnum\">6</span><span>That night the star rose later. And everywhere the world was awake that night, and throughout Christendom a sombre murmur hung in the keen air over the countryside like the belling of bees in the heather, and this murmurous tumult grew to a clangour in the cities. It was the tolling of the bells in a million belfry towers and steeples, summoning the people to sleep no more, to sin no more, but to gather in their churches and pray. And overhead, growing larger and brighter as the earth rolled on its way and the night passed, rose the dazzling star.</span></p><p class=\"ppara\"><span class=\"pnum\">7</span><span>And the streets and houses were alight in all the cities, the shipyards glared, and whatever roads led to high country were lit and crowded all night long. And in all the seas about the civilized lands, ships with throbbing engines, and ships with bellying sails, crowded with men and living creatures, were standing out to ocean and the north. For already the warning of the master mathematician had been telegraphed all over the world, and translated into a hundred tongues. The new planet and Neptune, locked in a fiery embrace, were whirling headlong, ever faster and faster towards the sun. Already every second this blazing mass flew a hundred miles, and every second its terrific velocity increased. As it flew now, indeed, it must pass a hundred million of miles wide of the earth and scarcely affect it. But near its destined path, as yet only slightly perturbed, spun the mighty planet Jupiter and his moons sweeping splendid round the sun. Every moment now the attraction between the fiery star and the greatest of the planets grew stronger. And the result of that attraction? Inevitably Jupiter would be deflected from its orbit into an elliptical path, and the burning star, swung by his attraction wide of its sunward rush, would &ldquo;describe a curved path&rdquo; and perhaps collide with, and certainly pass very close to, our earth. &ldquo;Earthquakes, volcanic outbreaks, cyclones, sea waves, floods, and a steady rise in temperature to I know not what limit&rdquo;&mdash;so prophesied the master mathematician.</span></p>"}, "serpent": {"label": "Serpent Mound", "html": "<h3 class=\"ptitle\">Serpent Mound</h3><div class=\"byline\">Ohio, 1846</div><p class=\"pintro\">The Great Serpent Mound, located in Adams County, Ohio, is a human-made mound of earth that researchers believe was created between 300 B.C. and A.D. 1100 by an indigenous culture.</p><div class=\"stanza\"><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">Brush Creek stood low when the museum men came</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">with their measuring tapes and sketchbooks.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:2.6em;text-indent:-1.1em\">It was winter. Fringed with ice,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:2.6em;text-indent:-1.1em\">the creek doubled back on itself</span></div><div class=\"pline\"><span class=\"lnum\">5</span><span style=\"padding-left:1.1em;text-indent:-1.1em\">as if it had forgotten something.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:2.6em;text-indent:-1.1em\">Pa was in Cincinnati, or else on his way home,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.1em;text-indent:-1.1em\">so Ma told me to lead the men</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.1em;text-indent:-1.1em\">into the marshy low grounds. It being winter,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:5.6em;text-indent:-1.1em\">there was little underbrush to speak of&mdash;</span></div><div class=\"pline\"><span class=\"lnum\">10</span><span style=\"padding-left:5.6em;text-indent:-1.1em\">in the summer there would have been</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.1em;text-indent:-1.1em\">briars, poison ivy, biting flies. I listened</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">for the <i>swish</i> of a beaver&rsquo;s heavy tail,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:2.6em;text-indent:-1.1em\">the chitter of a chickadee, or the cry of a hawk,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:2.6em;text-indent:-1.1em\">but the winter silence of the creek pressed</span></div><div class=\"pline\"><span class=\"lnum\">15</span><span style=\"padding-left:2.6em;text-indent:-1.1em\">down on all of us like a weight.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">The humps in the ground were all but</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">invisible until you were right up on them. The figure</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:2.6em;text-indent:-1.1em\">was even less obvious: the sinuous body,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:2.6em;text-indent:-1.1em\">the tail coiled three times around,</span></div><div class=\"pline\"><span class=\"lnum\">20</span><span style=\"padding-left:2.6em;text-indent:-1.1em\">and at the other end, the mouth wide open.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.1em;text-indent:-1.1em\">In the summer the creek bottom was crowded</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.1em;text-indent:-1.1em\">with so much life that you could trip over</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:5.6em;text-indent:-1.1em\">the ridges of earth before you saw</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:5.6em;text-indent:-1.1em\">anything at all. In winter you could climb</span></div><div class=\"pline\"><span class=\"lnum\">25</span><span style=\"padding-left:5.6em;text-indent:-1.1em\">a tree and get some idea of the whole thing:</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.1em;text-indent:-1.1em\">the serpent&rsquo;s body undulating, slithering</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">silently across the ancient</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:2.6em;text-indent:-1.1em\">earth. At the mouth end, there was an oval mound</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:2.6em;text-indent:-1.1em\">as if the snake were about to swallow an egg&mdash;</span></div><div class=\"pline\"><span class=\"lnum\">30</span><span style=\"padding-left:1.1em;text-indent:-1.1em\">as snakes sometimes did in our rickety</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">henhouse&mdash;my Pa always said, or</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">as if swallowing the sun, one of the museum</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:2.6em;text-indent:-1.1em\">men suggested, taking notes with his quill pen,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:2.6em;text-indent:-1.1em\">an old-style inkhorn slung at his side.</span></div><div class=\"pline\"><span class=\"lnum\">35</span><span style=\"padding-left:2.6em;text-indent:-1.1em\">I liked that: swallowing the sun,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.1em;text-indent:-1.1em\">just the sort of thing a snake might do,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.1em;text-indent:-1.1em\">might want to do. When, later, I told my sister Ruth,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:5.6em;text-indent:-1.1em\">she disagreed. It is singing to the sun,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:5.6em;text-indent:-1.1em\">she insisted. That is why its mouth</span></div><div class=\"pline\"><span class=\"lnum\">40</span><span style=\"padding-left:4.1em;text-indent:-1.1em\">is wide open. She said, &ldquo;Sometimes I think</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">I hear it on summer nights. Not swallowing, singing.&rdquo;</span></div></div>"}, "memory": {"label": "A Memory Revolution", "html": "<h3 class=\"ptitle\">A Memory Revolution</h3><p class=\"ppara\"><span class=\"pnum\">1</span><span>A high school senior logs on to a computer at the library to double-check the application due date listed on a college admissions website. Nearby, a librarian helps a group of biology students use a database to search for recent studies about mammals. In the past few decades, the Internet has become an integral component of daily life for many people. The seemingly limitless power of search engines made the Internet search extremely common, and today people increasingly rely on the Internet&rsquo;s vast accumulation of sources to access all types of information. Scientists are beginning to examine how this reliance is modifying the strategies people use to store and prioritize information in their mind.</span></p><h4 class=\"phead\">A Dependable and Valuable Asset</h4><p class=\"ppara\"><span class=\"pnum\">2</span><span>Psychologist Benjamin Storm from the University of California, Santa Cruz, and researchers Sean Stone and Aaron Benjamin devised an experiment to study students&rsquo; tendency to depend on the Internet for facts. To begin, the scientists divided sixty participants into multiple groups, including an &ldquo;Internet&rdquo; group and a &ldquo;memory&rdquo; group, and placed them in front of computers. The Internet group was required to use the search engine Google to answer eight challenging trivia questions. In contrast, participants in the memory group were permitted to use only their personal knowledge to answer the questions. In the second round, the researchers administered notably easier questions. This time, they allowed each group the option of using Google as they answered. Their results showed that 83 percent of the Internet group continued to consult Google in the second round, while only 63 percent of the memory group chose to do so.</span></p><p class=\"ppara\"><span class=\"pnum\">3</span><span>People&rsquo;s growing inclination to rely on the Internet in order to retrieve information, particularly facts and figures, is called cognitive offloading. Canadian researcher Evan F. Risko and British researcher Sam Gilbert, who have written extensively about the topic, say a similar process has been taking place for centuries. In the past, people used resources like encyclopedias to assist their memories; however, today the Internet, serving as a vast extended memory, allows people to digitally access and retrieve much larger volumes of information. Consequently, people&rsquo;s minds are free for other cognitive feats, such as connecting data, learning new information, or solving problems.</span></p><h4 class=\"phead\">Filing Information Away</h4><p class=\"ppara\"><span class=\"pnum\">4</span><span>The use of the Internet also appears to be modifying the strategies people use to store information in their mind. Researchers Betsy Sparrow from Columbia University, Jenny Liu from the University of Wisconsin&ndash;Madison, and Daniel Wegner from Harvard University conducted several studies to discover how people efficiently manage their information intake.</span></p><p class=\"ppara\"><span class=\"pnum\">5</span><span>To begin, the researchers examined how people evaluate which information deserves their effort to remember. For this experiment, participants read forty trivia facts, such as &ldquo;An ostrich&rsquo;s eye is bigger than its brain,&rdquo; and typed the statements into a computer file. Half the participants had been previously told the file would be saved, while half believed it would be erased. Next, the participants wrote down every fact they could recall. Those who believed the information would be erased and no longer available could recall 40 percent more facts than those who thought the information would be saved.</span></p><p class=\"ppara\"><span class=\"pnum\">6</span><span>In another experiment, the same researchers tested the ability of study participants to remember where to access information. For this trial, participants read and typed trivia statements, which they saved in folders with generic names such as &ldquo;Facts&rdquo; and &ldquo;Items.&rdquo; After spending ten minutes writing down all the facts they could recall from memory, participants were asked which folder contained a particular fact based on a keyword. For example, &ldquo;Which folder has the fact about ostriches?&rdquo; Overall, participants recalled the information&rsquo;s location more often than the content itself, correctly identifying 49 percent of the folders for specific facts while remembering only 23 percent of the actual trivia. The researchers concluded that our memory is adapting to the Internet age by prioritizing where to locate information even when the specific details are forgotten. According to Sparrow, the Internet has become an important form of transactive memory, an external source of the recollections and associative networks that constitute memory.</span></p><p class=\"ppara\"><span class=\"pnum\">7</span><span>As the Internet&rsquo;s resources continue to expand our &ldquo;external&rdquo; memory, some question whether the process may cause people to depend too heavily on technology. However, Steven Pinker, a professor of psychology at Harvard University, says, &ldquo;Knowledge is increasing exponentially; human brainpower and waking hours are not. Fortunately, the Internet and information technologies are helping us manage, search and retrieve our collective intellectual output at different scales, from Twitter and previews to e-books and online encyclopedias. Far from making us stupid, these technologies are the only things that will keep us smart.&rdquo;</span></p><figure class=\"pfig\"><svg viewBox=\"0 0 700 382\" width=\"700\" height=\"382\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Georgia,serif\" fill=\"#1a2433\"><text x=\"352\" y=\"26\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" letter-spacing=\"1.2\">HOW MEMORY WORKS</text><rect x=\"124\" y=\"192\" width=\"104\" height=\"58\" fill=\"#fff\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><text x=\"176\" y=\"216\" text-anchor=\"middle\" font-size=\"14\">Sensory</text><text x=\"176\" y=\"234\" text-anchor=\"middle\" font-size=\"14\">Memory</text><rect x=\"300\" y=\"192\" width=\"104\" height=\"58\" fill=\"#fff\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><text x=\"352\" y=\"216\" text-anchor=\"middle\" font-size=\"14\">Short-Term</text><text x=\"352\" y=\"234\" text-anchor=\"middle\" font-size=\"14\">Memory</text><rect x=\"476\" y=\"192\" width=\"104\" height=\"58\" fill=\"#fff\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><text x=\"528\" y=\"216\" text-anchor=\"middle\" font-size=\"14\">Long-Term</text><text x=\"528\" y=\"234\" text-anchor=\"middle\" font-size=\"14\">Memory</text><line x1=\"30\" y1=\"221\" x2=\"116\" y2=\"221\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><path d=\"M 124 221 L 115 216 L 115 226 z\" fill=\"#1a2433\"/><text x=\"77\" y=\"210\" text-anchor=\"middle\" font-size=\"13\">New Information</text><line x1=\"228\" y1=\"221\" x2=\"292\" y2=\"221\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><path d=\"M 300 221 L 291 216 L 291 226 z\" fill=\"#1a2433\"/><text x=\"264\" y=\"210\" text-anchor=\"middle\" font-size=\"13\">Attention</text><line x1=\"404\" y1=\"221\" x2=\"468\" y2=\"221\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><path d=\"M 476 221 L 467 216 L 467 226 z\" fill=\"#1a2433\"/><text x=\"440\" y=\"210\" text-anchor=\"middle\" font-size=\"13\">Storage</text><path d=\"M 308 192 C 260 88, 444 88, 382 183\" fill=\"none\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><path d=\"M 374 192 L 376 179 L 385 187 z\" fill=\"#1a2433\"/><text x=\"352\" y=\"158\" text-anchor=\"middle\" font-size=\"14\">Rehearsal</text><text x=\"352\" y=\"62\" text-anchor=\"middle\" font-size=\"13\">Information is maintained</text><text x=\"352\" y=\"80\" text-anchor=\"middle\" font-size=\"13\">through repetition.</text><path d=\"M 528 250 C 528 290, 408 290, 386 260\" fill=\"none\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><path d=\"M 378 254 L 392 256 L 384 267 z\" fill=\"#1a2433\"/><text x=\"460\" y=\"306\" text-anchor=\"middle\" font-size=\"13\">Retrieval</text><line x1=\"310\" y1=\"250\" x2=\"310\" y2=\"294\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><path d=\"M 310 302 L 305 292 L 315 292 z\" fill=\"#1a2433\"/><line x1=\"528\" y1=\"250\" x2=\"528\" y2=\"294\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><path d=\"M 528 302 L 523 292 L 533 292 z\" fill=\"#1a2433\"/><text x=\"310\" y=\"326\" text-anchor=\"middle\" font-size=\"13\">Unrehearsed</text><text x=\"310\" y=\"344\" text-anchor=\"middle\" font-size=\"13\">information is</text><text x=\"310\" y=\"362\" text-anchor=\"middle\" font-size=\"13\">forgotten.</text><text x=\"534\" y=\"326\" text-anchor=\"middle\" font-size=\"13\">Some information</text><text x=\"534\" y=\"344\" text-anchor=\"middle\" font-size=\"13\">may be forgotten</text><text x=\"534\" y=\"362\" text-anchor=\"middle\" font-size=\"13\">over time.</text></svg></figure>"}, "orwell": {"label": "Orwell: Overcoming Adversity", "html": "<h3 class=\"ptitle\">Orwell: Overcoming Adversity</h3><p class=\"ppara\"><span class=\"pnum\">1</span><span>Although it took the publication of his now-famous novel <i>Animal Farm</i> in 1945 to finally establish British writer George Orwell&rsquo;s reputation for shrewd political commentary, this well-known satire did not mark the beginning of Orwell&rsquo;s writing career. Indeed, by the time Orwell achieved fame, he had already been writing seriously for nearly fifteen years. In the decade preceding his completion of <i>Animal Farm</i>, Orwell struggled to make ends meet as a writer. He managed to scrape by, subsisting on writing assignments that paid his bills but lacked creative possibilities. In fact, right up to his final, bedridden days, much of Orwell&rsquo;s life was marked by a struggle of one kind or another.</span></p><p class=\"ppara\"><span class=\"pnum\">2</span><span>Born in 1903 to a lower-middle-class father who was a British civil servant in India<sup>1</sup>, Orwell moved to England with his parents when he was just eight years old. He was sent away to boarding school and then educated at Eton College, where he first began to write. He was distinguished among his classmates by his brilliance and his relative poverty, both of which affected his life and his choices. Orwell&rsquo;s talent won him recognition and the opportunity to publish his essays in school periodicals. But feeling that he did not fit in, Orwell ultimately returned to India&mdash;following in his father&rsquo;s footsteps&mdash;rather than study further in England.</span></p><p class=\"ppara\"><span class=\"pnum\">3</span><span>In India, he became an administrator for the Indian Imperial Police. Again, Orwell struggled, this time with the clash between his responsibilities as a bureaucrat of the British government and his growing disillusionment with the concept of imperialism<sup>2</sup>. In fact, it was during these years that Orwell first began to feel the intense disenchantment with large state bureaucracies that fills the pages of his later, and most popular, literary works.</span></p><p class=\"ppara\"><span class=\"pnum\">4</span><span>Upon his return to England in 1928, Orwell wrote a series of essays exploring this discontent. Then, in 1930, he began his literary career in earnest. Immersing himself in the slums of London, Orwell attempted to fully experience the everyday adversity of poverty. This research resulted in the acclaimed 1933 book <i>Down and Out in Paris and London</i>. In late 1936, already a committed socialist, Orwell was sent to Spain to report on the civil war. Once there, however, he quickly abandoned his responsibilities as a journalist and joined the communist Republican Army in its struggle against the Nationalists. After more than 100 days on the front lines, Orwell was promoted to second lieutenant, given command of more than 30 men&mdash;and wounded by a sniper. During this time, thrust into violent clashes, Orwell again found his political identity changing.</span></p><p class=\"ppara\"><span class=\"pnum\">5</span><span>By the time he returned to England in 1938, he had grown cynical about communism, a change that alienated his left-wing publishers. Nevertheless, the ideological shift inspired his crowning literary achievement, the wholly pessimistic and satirical novel <i>Nineteen Eighty-Four</i>, which depicts the threat of political tyranny in the future. Unfortunately, Orwell would not live to experience the tremendous impact of this final work, as one last struggle&mdash;this time with tuberculosis&mdash;claimed his life just months after the novel&rsquo;s release in 1949.</span></p><p class=\"pnote\"><sup>1</sup>British rule was in effect on the Indian subcontinent from 1858 to 1947.</p><p class=\"pnote\"><sup>2</sup>imperialism: rule over other nations or territories, often by force.</p>"}, "college": {"label": "The Free College Debate", "html": "<h3 class=\"ptitle\">The Free College Debate</h3><p class=\"ppara\"><span></span><span>(1) A college degree has become an essential tool in an increasingly competitive job market. (2) Yet the price of higher education, at both private and public universities, continues to rise. (3) Helping students cover the cost of attending college is an important issue.</span></p><p class=\"ppara\"><span></span><span>(4) Many people agree that a college education should be a financially realistic option for those who aspire to obtain a degree. (5) For example, in 2017, the New York State legislature passed a bill creating a program to cover the tuition costs for nearly one million students. (6) The state of Tennessee also has a program that offers all students scholarships and mentoring services if they attend one of the state&rsquo;s community colleges. (7) Proponents generally believe that these programs are a step in the right direction for making college affordable for students who would have had to take out loans or who would have decided not to pursue higher education at all.</span></p><p class=\"ppara\"><span></span><span>(8) On the other hand, some people oppose bills like the ones in New York and Tennessee because they believe &ldquo;free&rdquo; college programs are unsustainable. (9) In order to implement these types of programs, a state pays the college on behalf of the students using funds from the state&rsquo;s budget, which primarily comes from state taxes. (10) As more students choose to attend college, more funds will be needed to cover the costs. (11) Additionally, many students do not finish college within four years because they switch majors or because they have to work. (12) Critics believe that these circumstances will inevitably lead to an increase in taxes, a decline in the quality of the education offered by the schools, or both. (13) They think narrower college-affordability efforts that target the students who need the most support, such as first-generation college students, may be more effective and viable solutions.</span></p><p class=\"ppara\"><span></span><span>(14) Faculty and students at higher-education institutions can work to keep costs down. (15) In light of increased access to computers, mobile devices, and the Internet, there are more opportunities for students to take courses online, thus reducing the need for and cost of maintaining physical classrooms. (16) Additionally, colleges should account for experience by allowing students to demonstrate their knowledge in order to avoid having to pay to sit through classes on subjects they have already mastered. (17) Similarly, college-bound high school students need to be prepared for college-level work so that they do not have to spend money on remedial classes.</span></p><p class=\"ppara\"><span></span><span>(18) The solutions to the problems associated with rising college costs are not simple. (19) Passing legislation that boosts college affordability will take time, input from experts with different ideas, and careful planning.</span></p>"}, "beston": {"label": "The Outermost House", "html": "<h3 class=\"ptitle\">Excerpt from <i>The Outermost House</i></h3><div class=\"byline\">by Henry Beston</div><p class=\"pintro\">Eastham Beach lies on the outer arm of Cape Cod, in Massachusetts, where a long wall of sand dunes stands between the Atlantic Ocean and the marshes behind it. In this excerpt, the author describes the small house he built there.</p><p class=\"ppara\"><span class=\"pnum\">1</span><span>Outermost cliff and solitary dune, the plain of ocean and the far, bright rims of the world, meadow land and marsh and ancient moor: this is Eastham; this the outer Cape. Sun and moon rise here from the sea, the arched sky has an ocean vastness, the clouds are now of ocean, now of earth. Having known and loved this land for many years, it came about that I found myself free to visit there, and so I built myself a house upon the beach.</span></p><p class=\"ppara\"><span class=\"pnum\">2</span><span>My house stood by itself atop a dune, a little less than halfway south on Eastham bar. I drew the home-made plans for it myself and it was built for me by a neighbour and his carpenters. When I began to build, I had no notion whatever of using the house as a dwelling place. I simply wanted a place to come to in the summer, one cosy enough to be visited in winter could I manage to get down. I called it the Fo&rsquo;castle.<sup>1</sup> It consisted of two rooms, a bedroom and a kitchen-living room, and its dimensions over all were but twenty by sixteen. A brick fireplace with its back to the wall between rooms heated the larger space and took the chill off the bedroom, and I used a two-burner oil stove when cooking.</span></p><p class=\"ppara\"><span class=\"pnum\">3</span><span>My neighbour built well. The house, even as I hoped, proved compact and strong, and it was easy to run and easy to heat. The larger room was sheathed, and I painted the wainscoting and the window frames a kind of buff-fawn&mdash;a good fo&rsquo;castle colour. The house showed, perhaps, a somewhat amateur enthusiasm for windows. I had ten. In my larger room I had seven; a pair to the east opening on the sea, a pair to the west commanding the marshes, a pair to the south, and a small &ldquo;look-see&rdquo; in the door. Seven windows in one room perched on a hill of sand under an ocean sun&mdash;the words suggest cross-lights and a glare; a fair misgiving, and one I countered by the use of wooden shutters originally meant for winter service but found necessary through the year. By arranging these I found I could have either the most sheltered and darkened of rooms or something rather like an inside out-of-doors. In my bedroom I had three windows&mdash;one east, one west, and one north to Nauset light.</span></p><p class=\"ppara\"><span class=\"pnum\">4</span><span>. . . I had two oil lamps and various bottle candlesticks to read by, and a fireplace crammed maw-full of driftwood to keep me warm. I have no doubt that the fireplace heating arrangement sounds demented, but it worked, and my fire was more than a source of heat&mdash;it was an elemental presence, a household god, and a friend.</span></p><p class=\"ppara\"><span class=\"pnum\">5</span><span>Using a knapsack, I carried my supplies on my own shoulders. There is no road through the dunes, and, even if there were, no one would have made deliveries. West of the dunes, it is true, there exists a kind of trail on which Fords<sup>2</sup> may venture, but even the most experienced of the villagers are wary of it and tell of being mired there or stuck in the sand. Nevertheless, my lumber came by this trail, and now and then I could get my oil cans carried down by a neighbour who had a horse and cart. These helps, however, were but occasional, and I counted myself fortunate to have had them at all. My knapsack remained the only ever-ready wagon of the dunes. Twice a week, by arrangement, a friend met me at Nauset Station with a car, took me shopping to Eastham or Orleans, and brought me back again to Nauset. And there I would pack my milk and eggs and butter and rolls&mdash;being very careful as to which was sitting on which&mdash;and strike off down the beach along the breakers.</span></p><p class=\"ppara\"><span class=\"pnum\">6</span><span>The top of the mound I built on stands scarce twenty feet above high-water mark, and only thirty in from the great beach. The coast guards at Nauset, a scant two miles away, were my only neighbours. South lay the farther dunes and a few far-away and lonely gunning camps;<sup>3</sup> the floor of marsh and tide parted me on the west from the village and its distant cottages; the ocean besieged my door. North, and north alone, had I touch with human things. On its solitary dune my house faced the four walls of the world.</span></p><p class=\"ppara\"><span class=\"pnum\">7</span><span>My house completed, and tried and not found wanting by a first Cape Cod year, I went there to spend a fortnight in September. The fortnight ending, I lingered on, and as the year lengthened into autumn, the beauty and mystery of this earth and outer sea so possessed and held me that I could not go. The world to-day is sick to its thin blood for lack of elemental things, for fire before the hands, for water welling from the earth, for air, for the dear earth itself underfoot. In my world of beach and dune these elemental presences lived and had their being, and under their arch there moved an incomparable pageant of nature and the year. The flux and reflux of ocean, the incomings of waves, the gatherings of birds, the pilgrimages of the peoples of the sea, winter and storm, the splendour of autumn and the holiness of spring&mdash;all these were part of the great beach. The longer I stayed, the more eager was I to know this coast and to share its mysterious and elemental life; I found myself free to do so, I had no fear of being alone, I had something of a field naturalist&rsquo;s inclination; presently I made up my mind to remain and try living for a year on Eastham Beach.</span></p><p class=\"pnote\"><sup>1</sup>Fo&rsquo;castle: forecastle, the cramped quarters for the crew in the bow of a ship.</p><p class=\"pnote\"><sup>2</sup>Fords: early automobiles.</p><p class=\"pnote\"><sup>3</sup>gunning camps: small shelters used by duck hunters.</p>"}}, "textOrder": ["wells", "beston", "serpent", "memory", "orwell", "college"], "figs": {}};
var STORE = "shsat_combined_v1";

var queue = [], idx = 0, answers = {}, pending = null, elapsed = 0;
var mode = "start", ticker = null, viewText = null, secStart = 0;

var app = document.getElementById("app");
var bar = document.getElementById("bar");
var track = document.getElementById("track");

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function fmt(sec){
  var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h+":"+(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function key(it){ return it.sec + "-" + it.n; }
// A "set" is a run of consecutive items sharing a grp (one passage's
// questions).  Items without a grp are their own set -> forward-only.
function grpKey(it){ return it.sec + "/" + (it.grp ? it.grp : "@" + it.n); }
function setBounds(i){
  var g=grpKey(queue[i]), a=i, b=i;
  while (a>0 && grpKey(queue[a-1])===g) a--;
  while (b<queue.length-1 && grpKey(queue[b+1])===g) b++;
  return [a,b];
}
function setBlanks(a,b){
  var c=0;
  for (var i=a;i<=b;i++){
    var v = (i===idx ? pending : answers[key(queue[i])]);
    if (!v) c++;
  }
  return c;
}
function norm(v){
  return String(v == null ? "" : v).trim()
    .replace(/&minus;/g,"-").replace(/\u2212/g,"-").replace(/[$,%\s]/g,"");
}
function same(a, b){
  var x = norm(a), y = norm(b);
  if (!x) return false;
  if (x === y) return true;
  var fx = parseFloat(x), fy = parseFloat(y);
  return !isNaN(fx) && !isNaN(fy) && Math.abs(fx - fy) < 1e-9;
}
function answered(){ var c=0; for (var k in answers){ if (answers[k]) c++; } return c; }

function ask(head, msg, yesLabel, onYes){
  var m=document.getElementById("modal");
  document.getElementById("modal-h").textContent=head;
  document.getElementById("modal-p").textContent=msg;
  var yes=document.getElementById("modal-yes"), no=document.getElementById("modal-no");
  yes.textContent=yesLabel; m.hidden=false; yes.focus();
  function close(){ m.hidden=true; yes.onclick=null; no.onclick=null; }
  yes.onclick=function(){ close(); onYes(); };
  no.onclick=close;
}

function save(){
  try{ localStorage.setItem(STORE, JSON.stringify(
    {idx:idx, answers:answers, elapsed:elapsed, mode:mode,
     secs:queue.length?uniqSecs():null})); }catch(e){}
}
function uniqSecs(){
  var out=[]; queue.forEach(function(i){ if(out.indexOf(i.sec)<0) out.push(i.sec); }); return out;
}
function wipe(){ try{ localStorage.removeItem(STORE); }catch(e){} }
function tick(){ elapsed++; if (elapsed % 15 === 0) save(); }
function startTicker(){ if(ticker) clearInterval(ticker); ticker=setInterval(tick,1000); }
function stopTicker(){ if(ticker){ clearInterval(ticker); ticker=null; } }

function secOf(k){
  for (var i=0;i<DATA.sections.length;i++) if (DATA.sections[i].key===k) return DATA.sections[i];
  return null;
}

/* ---------- text lock state ---------- */
function lastIdxOfText(tk){
  var last=-1;
  for (var i=0;i<queue.length;i++) if (queue[i].text===tk) last=i;
  return last;
}
function textState(tk){
  var li=lastIdxOfText(tk);
  if (li<0) return "none";
  if (idx>li) return "done";
  var cur=queue[idx];
  if (cur && cur.text===tk) return "current";
  return "future";
}

function paintChrome(){
  var showing = (mode==="test");
  bar.hidden=!showing; track.hidden=!showing;
  if(!showing) return;
  var it=queue[idx];
  document.getElementById("secname").textContent = "· " + secOf(it.sec).label;
  var secItems=queue.filter(function(q){return q.sec===it.sec;});
  var done=secItems.filter(function(q){return !!answers[key(q)];}).length;
  document.getElementById("count").textContent = done+" of "+secItems.length+" answered";
  document.getElementById("trackbar").style.width = ((idx/queue.length)*100)+"%";
}

/* ---------- screens ---------- */
function screenStart(){
  return '<div class="wrap"><div class="card">'+
    '<h1>SHSAT Practice Test</h1>'+
    '<p class="lede">Fifty English Language Arts questions and fifty Mathematics questions, '+
      'untimed. Questions appear in a fixed order. Within one reading text\u2019s set of '+
      'questions you may move back and forth; everything else moves forward only.</p>'+
    '<ul class="rules">'+
      '<li><b>Reading texts</b><span>Each reading text stays open in a panel beside the '+
        'questions. Use the tabs to move between texts &mdash; once you finish a text, it '+
        'closes and cannot be reopened.</span></li>'+
      '<li><b>Answer choices</b><span>Every question has four choices, lettered A&ndash;D '+
        'and E&ndash;H in turn. Five mathematics questions are grid-in: type a numerical '+
        'answer, with no choices given.</span></li>'+
      '<li><b>Navigation</b><span>The questions about one reading text form a set. Inside a '+
        'set you can move back and forth with the arrows and change your answers. Submitting '+
        'the last question of a set closes the set and its text for good. Revising and Editing '+
        'questions and all mathematics questions move forward only.</span></li>'+
      '<li><b>Scoring</b><span>No feedback appears while you work. The test is scored '+
        'automatically as soon as you finish.</span></li>'+
    '</ul>'+
    '<h2>Choose what to take</h2>'+
    '<div class="picks">'+
      '<button class="pick" data-secs="ela"><b>English Language Arts</b>'+
        '<span>50 questions &middot; 6 texts &middot; back within a set</span></button>'+
      '<button class="pick" data-secs="math"><b>Mathematics</b>'+
        '<span>50 questions &middot; 5 grid-in</span></button>'+
      '<button class="pick" data-secs="ela,math"><b>Full test</b>'+
        '<span>100 questions &middot; both sections</span></button>'+
    '</div>'+
    '<p class="tip">Scratch paper and a pencil are allowed. Calculators are not.</p>'+
  '</div></div>';
}

function screenSecIntro(){
  var it=queue[idx], s=secOf(it.sec);
  var n=queue.filter(function(q){return q.sec===it.sec;}).length;
  var body = it.sec==="ela"
    ? '<p class="lede">This section has two parts. Revising/Editing questions ask you to '+
      'correct and improve writing. Reading Comprehension questions are based on six texts, '+
      'each shown in a panel beside the questions.</p>'
    : '<p class="lede">Solve each problem and choose the best answer from the four choices '+
      'given. Five questions are grid-in: no choices appear and you type the answer. The '+
      'questions get harder as the section goes on.</p>';
  return '<div class="wrap"><div class="card">'+
    '<div class="eyebrow"><span class="qnum">Section</span></div>'+
    '<h1>'+s.label+'</h1>'+ body +
    '<div class="stats"><div class="stat"><div class="k">Questions</div>'+
      '<div class="v">'+n+'</div></div></div>'+
    '<div class="actions"><div class="note">Once you begin, you cannot return to an earlier '+
      'question.</div><div class="btns">'+
      '<button class="btn btn-primary" id="gosec">Start section</button></div></div>'+
  '</div></div>';
}

function choiceRows(it){
  var rows="";
  for (var i=0;i<it.choices.length;i++){
    var c=it.choices[i];
    rows+='<button class="choice'+(pending===c.l?" on":"")+'" data-letter="'+c.l+'" '+
          'type="button"><span class="ltr">'+c.l+'</span><span class="ct">'+c.h+'</span></button>';
  }
  return '<div class="choices" role="group" aria-label="Answer choices">'+rows+'</div>';
}

function gridBox(){
  return '<div class="grid-in">'+
    '<label for="gridbox">Your answer</label>'+
    '<input id="gridbox" type="text" inputmode="text" autocomplete="off" spellcheck="false" '+
      'value="'+(pending==null?"":String(pending).replace(/"/g,"&quot;"))+'">'+
    '<div class="hint">Numbers only. Use a minus sign for a negative answer and a decimal '+
      'point if needed.</div></div>';
}

function questionCard(it, isLast){
  var secItems=queue.filter(function(q){return q.sec===it.sec;});
  var pos=secItems.indexOf(it)+1;
  var bd=setBounds(idx), a=bd[0], b=bd[1];
  var inSet=(b>a), atSetEnd=(idx===b), canBack=(idx>a);
  var fig = it.fig ? '<div class="qfig"><img src="'+DATA.figs[it.fig]+'" alt="Figure for this question"></div>' : '';

  var note;
  if (isLast)            note='Last question. The check mark submits your test.';
  else if (!inSet)       note='Once you move on, this question closes.';
  else if (atSetEnd)     note='Last question in this set. Submitting closes all '+
                              (b-a+1)+' and moves you on.';
  else                   note='You can move back and forth within this set until you '+
                              'submit the last question.';

  var fwdFinish = isLast || (inSet && atSetEnd);
  var fwdLabel  = isLast ? 'Finish test'
                         : (inSet && atSetEnd ? 'Submit this set' : 'Next question');

  return '<div class="eyebrow">'+
      '<span class="qnum">Question '+pos+' of '+secItems.length+'</span>'+
      (inSet ? '<span class="setpos">'+(idx-a+1)+' of '+(b-a+1)+' in this set</span>' : '')+
      (it.sec==="ela" && !it.text ? '<span class="badge">Revising / Editing</span>' : '')+
      (it.type==="grid" ? '<span class="badge">Grid-in</span>' : '')+
    '</div>'+
    fig +
    '<div class="stem">'+it.stem+'</div>'+
    (it.type==="grid" ? gridBox() : choiceRows(it))+
    '<div class="actions"><div class="note">'+note+'</div>'+
    '<div class="btns">'+
      (canBack ? '<button class="arrow back" id="prev" aria-label="Previous question" '+
                 'title="Previous question">&larr;</button>' : '')+
      '<button class="arrow'+(fwdFinish?" finish":"")+'" id="next" '+
      'aria-label="'+fwdLabel+'" title="'+fwdLabel+'">'+
      (isLast?"&#10003;":"&rarr;")+'</button>'+
    '</div></div>';
}

function passagePane(){
  var cur=queue[idx];
  var tabs="";
  DATA.textOrder.forEach(function(tk){
    var st=textState(tk);
    if (st==="none") return;
    var on = (viewText===tk);
    tabs+='<button class="ptab'+(on?" on":"")+(st==="done"?" done":"")+'" '+
          'data-tab="'+tk+'"'+(st==="done"?' aria-disabled="true"':'')+'>'+
          (st==="done"?'<span class="lk">&#128274;</span>':'')+
          DATA.texts[tk].label+'</button>';
  });
  var notice="";
  if (viewText && cur.text && viewText!==cur.text){
    notice='<div class="pnotice"><span>You are previewing another text. '+
      'The current question is about &ldquo;'+DATA.texts[cur.text].label+'&rdquo;.</span>'+
      '<button id="backcur">Back to current text</button></div>';
  }
  var html = viewText ? DATA.texts[viewText].html : '';
  return '<section class="pane passage"><div class="ptabs">'+tabs+'</div>'+
         '<div class="pbody" id="pbody">'+notice+html+'</div></section>';
}

function screenTest(){
  var it=queue[idx], isLast=(idx===queue.length-1);
  if (it.text){
    return '<div class="wrap wide"><div class="split">'+
      passagePane()+
      '<section class="pane qs">'+questionCard(it,isLast)+'</section>'+
    '</div></div>';
  }
  return '<div class="wrap"><div class="card">'+questionCard(it,isLast)+'</div></div>';
}

/* ---------- results ---------- */
function scored(){
  var out={total:{right:0,n:0}, secs:{}, rows:{}, missed:{}};
  queue.forEach(function(it){
    var s=it.sec;
    out.secs[s]=out.secs[s]||{right:0,n:0,blank:0};
    out.rows[s]=out.rows[s]||"";
    out.missed[s]=out.missed[s]||[];
    var a=answers[key(it)], ok=same(a, it.answer);
    out.secs[s].n++; out.total.n++;
    if(!a) out.secs[s].blank++;
    if(ok){ out.secs[s].right++; out.total.right++; } else out.missed[s].push(it.n);
    var secItems=queue.filter(function(q){return q.sec===s;});
    var pos=secItems.indexOf(it)+1;
    out.rows[s]+='<tr><td class="q">'+pos+'</td>'+
      '<td class="'+(a?(ok?"right":"wrong"):"blank")+'">'+(a?a:"&mdash;")+'</td>'+
      '<td>'+it.answer+'</td>'+
      '<td>'+(ok?'<span class="right">correct</span>'
                :'<span class="wrong">'+(a?"incorrect":"blank")+'</span>')+'</td></tr>';
  });
  return out;
}

function resultsText(){
  var s=scored();
  var name=(document.getElementById("student")||{}).value||"(no name)";
  var L=[];
  L.push("SHSAT Practice - English Language Arts and Mathematics");
  L.push("Student: "+name);
  L.push("Date: "+new Date().toLocaleDateString());
  L.push("Time: "+fmt(elapsed));
  L.push("");
  uniqSecs().forEach(function(k){
    var d=s.secs[k];
    L.push(secOf(k).label.toUpperCase()+": "+d.right+" / "+d.n+
           "  ("+Math.round(d.right/d.n*100)+"%)   blank: "+d.blank);
    L.push("  missed: "+(s.missed[k].length?s.missed[k].join(", "):"none"));
    L.push("");
  });
  if (uniqSecs().length>1)
    L.push("OVERALL: "+s.total.right+" / "+s.total.n+
           "  ("+Math.round(s.total.right/s.total.n*100)+"%)");
  L.push("");
  uniqSecs().forEach(function(k){
    L.push("--- "+secOf(k).label+" ---");
    L.push("Q    Yours   Key");
    var secItems=queue.filter(function(q){return q.sec===k;});
    secItems.forEach(function(it,i){
      var a=answers[key(it)]||"-";
      var pad=function(v,n){ v=String(v); while(v.length<n) v+=" "; return v; };
      L.push(pad(i+1,5)+pad(a,8)+pad(it.answer,6)+(same(a,it.answer)?"correct":"INCORRECT"));
    });
    L.push("");
  });
  return L.join("\n");
}

function copyResults(){
  var txt=resultsText();
  var done=function(){ var n=document.getElementById("mailnote");
    if(n) n.textContent="Results copied. Paste them wherever you keep them."; };
  function fallback(){
    try{
      var ta=document.createElement("textarea");
      ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }catch(e){
      var n=document.getElementById("mailnote");
      if(n) n.textContent="Copying was blocked here. Download this file and open it in your "+
          "browser, then try again.";
    }
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(done, fallback);
    else fallback();
  }catch(e){ fallback(); }
}
function printSheet(){
  var name=(document.getElementById("student")||{}).value||"";
  var slot=document.getElementById("phname");
  if(slot) slot.textContent = name ? name : "—";
  try{ window.print(); }catch(e){}
}

function screenResults(){
  var s=scored(), secs=uniqSecs();
  var d=new Date();
  var head='<div class="printhead"><div class="ph-title">SHSAT Practice &mdash; ELA &amp; Mathematics</div>'+
    '<div class="ph-meta">Score report &nbsp;&middot;&nbsp; Name: <span id="phname">&mdash;'+
    '</span> &nbsp;&middot;&nbsp; '+d.toLocaleDateString()+'</div></div>';
  var stats='<div class="stats">';
  secs.forEach(function(k){
    var v=s.secs[k];
    stats+='<div class="stat"><div class="k">'+secOf(k).label+'</div><div class="v">'+
      v.right+' / '+v.n+'</div></div>';
  });
  if (secs.length>1)
    stats+='<div class="stat"><div class="k">Overall</div><div class="v">'+
      s.total.right+' / '+s.total.n+'</div></div>';
  stats+='<div class="stat"><div class="k">Total time</div><div class="v">'+fmt(elapsed)+
    '</div></div></div>';
  var body="";
  secs.forEach(function(k){
    body+='<h2>'+secOf(k).label+' &mdash; questions missed</h2>'+
      '<p class="missed">'+(s.missed[k].length?s.missed[k].join(', ')
        :'None &mdash; a perfect section.')+'</p>'+
      '<h2>'+secOf(k).label+' &mdash; question by question</h2>'+
      '<table class="sheet"><thead><tr><th>Q</th><th>Yours</th><th>Key</th><th>Result</th>'+
      '</tr></thead><tbody>'+s.rows[k]+'</tbody></table>';
  });
  return '<div class="wrap"><div class="card">'+ head +
    '<h1 class="noprint">Test complete</h1>'+
    '<p class="lede noprint">Your test has been scored. Add a name below if you want it on '+
      'to send or print the report.</p>'+
    '<div class="namefield noprint"><label for="student">Student name</label>'+
      '<input id="student" type="text" autocomplete="off" placeholder="Optional"></div>'+

    stats + body +
    '<div class="actions noprint"><div class="note" id="mailnote">Copy the results to '+
      'paste them somewhere, or save the whole report as a PDF.</div>'+
    '<div class="btns">'+
      '<button class="btn btn-ghost" id="restart">Start over</button>'+
      '<button class="btn btn-ghost" id="copy">Copy results</button>'+
      '<button class="btn btn-ghost" id="print">Save as PDF</button>'+

    '</div></div>'+
  '</div></div>';
}

/* ---------- render ---------- */
function render(){
  if (mode==="start")        app.innerHTML=screenStart();
  else if (mode==="secintro")app.innerHTML=screenSecIntro();
  else if (mode==="test")    app.innerHTML=screenTest();
  else                       app.innerHTML=screenResults();
  paintChrome(); wire();
  if (mode!=="test") window.scrollTo(0,0);
}

function wire(){
  var $=function(i){ return document.getElementById(i); };

  var picks=app.querySelectorAll(".pick");
  for (var i=0;i<picks.length;i++){
    picks[i].onclick=function(){ begin(this.getAttribute("data-secs").split(",")); };
  }
  var go=$("gosec");
  if (go) go.onclick=function(){ mode="test"; syncView(); render(); };

  var cs=app.querySelectorAll(".choice[data-letter]");
  for (var j=0;j<cs.length;j++){
    cs[j].onclick=function(){ pending=this.getAttribute("data-letter"); render(); };
  }
  var gb=$("gridbox");
  if (gb){
    gb.oninput=function(){ pending=this.value; };
    gb.onkeydown=function(e){
      if (e.key==="Enter"){ e.preventDefault(); advance(); }
      if (e.key==="ArrowLeft" && !this.value){ e.preventDefault(); goBack(); }
    };
    gb.focus();
  }
  var nx=$("next"); if (nx) nx.onclick=advance;
  var pv=$("prev"); if (pv) pv.onclick=goBack;

  var tabs=app.querySelectorAll(".ptab[data-tab]");
  for (var t=0;t<tabs.length;t++){
    tabs[t].onclick=function(){
      var tk=this.getAttribute("data-tab");
      if (textState(tk)==="done"){
        ask("That text is closed",
            "You have already finished the questions for “"+DATA.texts[tk].label+
            "”, so it cannot be reopened.", "OK", function(){});
        return;
      }
      viewText=tk; render();
    };
  }
  var bc=$("backcur");
  if (bc) bc.onclick=function(){ viewText=queue[idx].text; render(); };

  var pr=$("print"); if (pr) pr.onclick=printSheet;
  var cp=$("copy"); if (cp) cp.onclick=copyResults;
  var st=$("student");
  if (st) st.oninput=function(){
    var s=$("phname"); if(s) s.textContent=this.value?this.value:"—"; };
  var rs=$("restart");
  if (rs) rs.onclick=function(){
    ask("Start over?","This clears every answer and returns you to the start screen.",
        "Start over", function(){
      wipe(); queue=[]; idx=0; answers={}; pending=null; elapsed=0;
      viewText=null; mode="start"; stopTicker(); render();
    });
  };
}

function syncView(){
  var it=queue[idx];
  viewText = it && it.text ? it.text : null;
}

function begin(secKeys){
  wipe();
  queue=[]; answers={}; idx=0; elapsed=0; pending=null;
  secKeys.forEach(function(k){
    var s=secOf(k);
    if (s) s.items.forEach(function(it){ queue.push(it); });
  });
  secStart=0; mode="secintro"; syncView(); startTicker(); render();
}

function step(to){
  var prevSec=queue[idx].sec;
  idx=to;
  pending = answers[key(queue[idx])] || null;
  syncView();
  save();
  if (queue[idx].sec!==prevSec) mode="secintro";
  render();
  if (mode==="test") window.scrollTo(0,0);
}

function goBack(){
  var bd=setBounds(idx);
  if (idx<=bd[0]) return;                       // never leave the current set
  if (pending) answers[key(queue[idx])]=pending;
  step(idx-1);
}

function advance(){
  var it=queue[idx];
  if (pending) answers[key(it)]=pending;
  var bd=setBounds(idx), a=bd[0], b=bd[1];

  if (idx===queue.length-1){
    ask("Finish the test?",
        "You will see your full score report. You cannot return to the questions.",
        "Finish test", finish);
    return;
  }
  // inside a set, with questions still ahead of us: just move on, nothing locks
  if (idx<b){ step(idx+1); return; }

  // at the end of a multi-question set: confirm, because this closes the set
  if (b>a){
    var blank=setBlanks(a,b), n=b-a+1;
    ask("Submit this set?",
        (blank
          ? "You have left "+blank+" of these "+n+" questions blank. "
          : "All "+n+" questions are answered. ")+
        "Submitting closes the set and its text. You cannot come back to it.",
        "Submit set", function(){ step(b+1); });
    return;
  }
  step(idx+1);
}

function finish(){ stopTicker(); mode="results"; save(); render(); }

document.addEventListener("keydown", function(e){
  if (mode!=="test") return;
  var it=queue[idx];
  if (it.type==="grid") return;          // the box handles its own keys
  var k=e.key.toUpperCase();
  for (var i=0;i<it.choices.length;i++){
    if (it.choices[i].l===k){ pending=k; render(); return; }
  }
  if (e.key==="Enter") advance();
  if (e.key==="ArrowLeft"){ e.preventDefault(); goBack(); }
  if (e.key==="ArrowRight"){ e.preventDefault(); advance(); }
});

render();
})();
</script>
</body>
</html>
